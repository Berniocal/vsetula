<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myšlenky k evangeliu</title>
<style>
:root{
  --bg:#f5f2eb; --paper:#fffdf9; --ink:#25211c; --muted:#756e64;
  --line:#ddd5c8; --accent:#75562c; --soft:#f1e7d7; --soft2:#fbf6ed;
  --shadow:0 10px 34px rgba(53,43,30,.07); --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:24px}
header{margin:6px 0 20px}
h1,h2,h3{font-family:Georgia,serif;font-weight:600}
h1{font-size:clamp(31px,5vw,48px);margin:0 0 6px}
header p{margin:0;color:var(--muted)}
.topnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.topnav button,.cycle-btn{
  border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 15px;cursor:pointer
}
.topnav button.active,.cycle-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.view{display:none}.view.active{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* Bible tree */
.bible-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
.bible-nav{padding:16px}
.bible-nav h2{font-size:20px;margin:0 0 12px}
.book-list{display:grid;gap:8px}
.book-row{border:1px solid var(--line);background:white;border-radius:13px;overflow:hidden}
.book-btn{width:100%;text-align:left;border:0;background:white;padding:11px 12px;cursor:pointer;font-weight:700}
.book-btn.active{background:var(--soft)}
.chapters{display:none;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 9px 10px}
.chapters.open{display:grid}
.chapter-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 2px;cursor:pointer;font-size:13px}
.chapter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.bible-main{padding:clamp(18px,4vw,32px)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bible-main h2{font-size:32px;margin:5px 0}
.source-note{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}
.passage{border-top:1px solid var(--line);padding:18px 0 0;margin-top:18px}
.passage:first-of-type{border-top:0;margin-top:0;padding-top:0}
.passage-title{font-weight:800;margin-bottom:12px}
.passage-thoughts{
  border:1px solid #ddc9a7;background:var(--soft2);border-radius:15px;padding:14px 15px;margin:0 0 18px
}
.passage-thoughts strong{display:block;margin-bottom:9px}
.thought-links{display:flex;flex-wrap:wrap;gap:8px}
.thought-link{
  border:1px solid #ccb387;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px
}
.thought-link.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.verse{display:grid;grid-template-columns:38px 1fr;gap:10px;border-top:1px solid #eee7dc;padding:11px 0}
.verse:first-of-type{border-top:0}
.vn{font:700 13px Georgia,serif;color:var(--accent);padding-top:4px}
.vtext{font:20px/1.55 Georgia,serif}
.verse-quote{
  margin-top:9px;border-left:3px solid #c7a66f;background:#fff9ef;border-radius:0 12px 12px 0;
  padding:10px 13px;font:16px/1.55 Georgia,serif
}

.verse-note-marker{
  margin-top:8px;width:28px;height:28px;border-radius:50%;border:1px solid #d6bd91;
  background:#fff9ef;color:var(--accent);cursor:pointer;font-weight:800;line-height:1;
  display:inline-flex;align-items:center;justify-content:center
}
.verse-note-marker:hover{background:var(--soft)}
.verse-quote{display:none}
.verse-quote.open{display:block}
.passage-thought-expanded{
  display:none;margin-top:12px;border:1px solid #ddc9a7;background:#fffaf2;
  border-radius:14px;padding:15px 16px
}
.passage-thought-expanded.open{display:block}
.passage-thought-expanded h4{margin:0 0 10px;font-size:16px}
.passage-thought-expanded p{margin:0 0 10px;line-height:1.68}
.passage-thought-expanded p:last-child{margin-bottom:0}

.placeholder{text-align:center;color:var(--muted);padding:80px 20px;line-height:1.6}

/* Archive */
.archive-layout{display:grid;grid-template-columns:310px 1fr;gap:18px}
.archive-side{padding:17px}
.archive-main{padding:clamp(18px,4vw,32px);min-height:560px}
.archive-side h2{font-size:21px;margin:0 0 12px}
.cycles{display:flex;gap:7px;margin-bottom:18px}
.cycle-btn{padding:7px 13px}
.sunday-list{display:grid;gap:9px}
.sunday-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer}
.sunday-item.active{background:var(--soft);border-color:#c9ae82}
.sunday-item strong{display:block}
.sunday-item span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.empty-cycle{color:var(--muted);font-size:14px;line-height:1.5;padding:8px 2px}
.sunday-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:3px}
.sunday-head h2{font-size:32px;margin:5px 0}
.sunday-meta{color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}
.transcript-section{padding:22px 0;border-top:1px solid var(--line)}
.transcript-section:first-of-type{border-top:0}
.transcript-section h3{font-size:23px;margin:0 0 12px}
.transcript-section p{font-size:16px;line-height:1.75;margin:0 0 12px}
.transcript-section p:last-child{margin-bottom:0}
.timecode{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px}
.editorial{margin-top:18px;padding:12px 14px;background:#faf6ef;border:1px solid #e4dbcd;border-radius:13px;color:var(--muted);font-size:12px;line-height:1.55}
footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}

/* Compact Bible text */
.passage{padding-top:15px;margin-top:15px}
.passage-title{margin-bottom:9px}
.verse-flow{
  font-family:Georgia,serif;
  font-size:16px;
  line-height:1.72;
  color:var(--ink);
}
.verse-inline{display:inline}
.verse-inline + .verse-inline{margin-left:.18em}
.verse-number{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:.68em;
  line-height:0;
  vertical-align:super;
  color:var(--accent);
  font-weight:800;
  margin-right:.28em;
}
.verse-note-marker{
  display:inline;
  width:auto;height:auto;
  margin:0 0 0 .18em;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  color:var(--accent);
  font-size:.82em;
  line-height:1;
  vertical-align:baseline;
  cursor:pointer;
  font-weight:800;
}
.verse-note-marker:hover{background:transparent;opacity:.7}
.verse-quote{
  display:none;
  margin:9px 0 12px;
  border-left:3px solid #c7a66f;
  background:#fff9ef;
  border-radius:0 12px 12px 0;
  padding:10px 13px;
  font:16px/1.55 Georgia,serif;
}
.verse-quote.open{display:block}
.chapter-nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.chapter-nav button{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}
.chapter-nav button:hover{background:var(--soft)}
.chapter-nav button:disabled{opacity:.35;cursor:default}
.theme-toggle{
  margin-left:auto;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:999px;
  padding:9px 14px;
  cursor:pointer;
}

/* Dark mode */
body.dark{
  --bg:#161513;
  --paper:#211f1c;
  --ink:#eee9df;
  --muted:#aaa398;
  --line:#3c3832;
  --accent:#d3aa70;
  --soft:#30291f;
  --soft2:#29251f;
  --shadow:0 10px 34px rgba(0,0,0,.22);
}
body.dark .card,
body.dark .book-row,
body.dark .book-btn,
body.dark .chapter-btn,
body.dark .sunday-item,
body.dark .pill,
body.dark .thought-link,
body.dark .cycle-btn,
body.dark .topnav button,
body.dark .chapter-nav button,
body.dark .theme-toggle,
body.dark .video-tools input,
body.dark .video-tools button{
  background:var(--paper);
  color:var(--ink);
  border-color:var(--line);
}
body.dark .book-btn.active,
body.dark .sunday-item.active{background:var(--soft)}
body.dark .chapter-btn.active,
body.dark .cycle-btn.active,
body.dark .topnav button.active,
body.dark .thought-link.active{
  background:var(--ink);
  color:#161513;
  border-color:var(--ink);
}
body.dark .passage-thoughts,
body.dark .passage-thought-expanded,
body.dark .verse-quote{
  background:#28231c;
  border-color:#5a4934;
}
body.dark .editorial,
body.dark .video-panel{background:#1d1b18}
body.dark .video-wrap{background:#111}
.theme-toggle-fixed{position:fixed;top:14px;right:14px;z-index:1000;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.passage-title{scroll-margin-top:16px}
.passage-video-expanded{display:none;margin-top:12px;border:1px solid #ddc9a7;background:#fffaf2;border-radius:14px;padding:14px}
.passage-video-expanded.open{display:block}
.passage-video-expanded .video-wrap{margin:0}
body.dark .passage-video-expanded{background:#28231c;border-color:#5a4934}
@media(max-width:650px){.theme-toggle-fixed{top:9px;right:9px;padding:8px 10px;font-size:13px}header{padding-top:38px}}



.video-panel{margin:20px 0 6px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbf8f2}
.video-panel h3{margin:0 0 12px;font-size:20px}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#ede8df;border-radius:13px;overflow:hidden}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.video-missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);line-height:1.5}
.video-tools{display:flex;gap:8px;margin-top:10px}
.video-tools input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:white}
.video-tools button{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 12px;cursor:pointer;font-weight:700}
.video-help{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}


@media(max-width:820px){
  .app{padding:13px}
  .bible-layout,.archive-layout{grid-template-columns:1fr}
  .verse-flow{font-size:16px;line-height:1.68}
  .chapter-nav button{flex:1;padding:10px 8px}
  .chapters{grid-template-columns:repeat(7,1fr)}
}
</style>
</head>
<body>
<div class="app">
<button class="theme-toggle theme-toggle-fixed" id="themeToggle" type="button">☾ Tmavý režim</button>

<header>
  <h1>Myšlenky k evangeliu</h1>
  <p>Evangelia propojená s videi k jednotlivým nedělím.</p>
</header>

<nav class="topnav">
  <button class="active" data-view="gospelView">Evangelia</button>
  <button data-view="archiveView">Neděle</button>
</nav>

<section id="gospelView" class="view active">
  <div class="bible-layout">
    <aside class="card bible-nav">
      <h2>Evangelia</h2>
      <div id="bookList" class="book-list"></div>
    </aside>
    <main class="card bible-main" id="bibleMain"></main>
  </div>
</section>

<section id="archiveView" class="view">
  <div class="archive-layout">
    <aside class="card archive-side">
      <h2>Neděle</h2>
      <div class="cycles">
        <button class="cycle-btn active" data-cycle="A">Cyklus A</button>
        <button class="cycle-btn" data-cycle="B">Cyklus B</button>
        <button class="cycle-btn" data-cycle="C">Cyklus C</button>
      </div>
      <div id="sundayList" class="sunday-list"></div>
    </aside>
    <main class="card archive-main" id="archiveMain"></main>
  </div>
</section>

<footer>Pracovní prototyp · modernizované znění podle Bible kralické.</footer>
</div>

<script src="data/matous.js"></script>
<script src="data/marek.js"></script>
<script src="data/lukas.js"></script>
<script src="data/jan.js"></script>
<script>
const BOOKS = {
  MAT:{name:"Matouš", short:"Mt", chapters:28},
  MRK:{name:"Marek", short:"Mk", chapters:16},
  LUK:{name:"Lukáš", short:"Lk", chapters:24},
  JHN:{name:"Jan", short:"Jan", chapters:21}
};

const SUNDAYS = {
  A:[{
    id:"A-04-ordinary-2026",
    title:"4. neděle v mezidobí",
    date:"1. 2. 2026",
    gospel:"Mt 5,1–12",
    videoEmbed:"https://www.youtube-nocookie.com/embed/9lovWV1zMtI"
  }],
  B:[],
  C:[]
};

let selectedBook="MAT", selectedChapter=5;

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  document.querySelectorAll(".topnav button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
}
document.querySelectorAll(".topnav button[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));

const themeToggle=document.getElementById("themeToggle");
function applyTheme(mode){
  const dark=mode==="dark";
  document.body.classList.toggle("dark",dark);
  themeToggle.textContent=dark ? "☀ Světlý režim" : "☾ Tmavý režim";
}
const savedTheme=localStorage.getItem("evangelium_theme");
applyTheme(savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeToggle.onclick=()=>{
  const next=document.body.classList.contains("dark") ? "light" : "dark";
  localStorage.setItem("evangelium_theme",next);
  applyTheme(next);
};


function renderBookTree(){
  const host=document.getElementById("bookList");
  host.innerHTML="";
  Object.entries(BOOKS).forEach(([id,b])=>{
    const row=document.createElement("div");
    row.className="book-row";

    const btn=document.createElement("button");
    btn.className="book-btn"+(id===selectedBook?" active":"");
    btn.textContent=b.name;
    btn.onclick=()=>{
      if(id!==selectedBook) selectedChapter=1;
      selectedBook=id;
      renderBookTree();
      renderBible();
    };
    row.appendChild(btn);

    const chapters=document.createElement("div");
    chapters.className="chapters"+(id===selectedBook?" open":"");
    for(let i=1;i<=b.chapters;i++){
      const c=document.createElement("button");
      c.className="chapter-btn"+(id===selectedBook && i===selectedChapter?" active":"");
      c.textContent=i;
      c.onclick=()=>{
        selectedBook=id; selectedChapter=i;
        renderBookTree(); renderBible();
      };
      chapters.appendChild(c);
    }
    row.appendChild(chapters);
    host.appendChild(row);
  });
}

function wireChapterInteractions(main){
  main.querySelectorAll("[data-inline-video]").forEach(btn=>{
    btn.onclick=()=>{
      const box=btn.closest(".passage").querySelector(".passage-video-expanded");
      const open=box.classList.toggle("open");
      btn.classList.toggle("active",open);
    };
  });
}

function scrollToChapterText(){
  requestAnimationFrame(()=>{
    const target=document.querySelector("#bibleMain .passage-title") || document.querySelector("#bibleMain h2");
    if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
  });
}

function renderBible(){
  const main=document.getElementById("bibleMain");
  const b=BOOKS[selectedBook];

  const sectionMap = selectedBook==="MAT" ? MATTHEW_SECTIONS : (selectedBook==="MRK" ? MARK_SECTIONS : (selectedBook==="LUK" ? LUKE_SECTIONS : (selectedBook==="JHN" ? JOHN_SECTIONS : null)));
  if(sectionMap && sectionMap[selectedChapter]){
    const sections=sectionMap[selectedChapter];
    main.innerHTML=`
      <div class="eyebrow">Evangelium podle ${b.name}</div>
      <h2>${selectedChapter}. kapitola</h2>
      <div class="source-note">Pracovní modernizované české znění podle Bible kralické. Cílem je věrné a srozumitelné znění v současné češtině, nikoli odborný nový překlad z řečtiny.</div>

      ${sections.map(section=>`
        <section class="passage">
          <div class="passage-title">${section.title} · ${section.range}</div>

          ${section.thoughts.length ? `
          <div class="passage-thoughts"><div class="thought-links"><button class="thought-link" data-inline-video="true">▶ Video s myšlenkami</button></div><div class="passage-video-expanded"><div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/9lovWV1zMtI" title="Video s myšlenkami k evangeliu" allowfullscreen></iframe></div></div></div>` : ""}

          <div class="verse-flow">
            ${section.verses.map(([n,t])=>{
              const q=null;
              return `
                <span class="verse-inline"><sup class="verse-number">${n}</sup>${t}${q?`<button class="verse-note-marker" data-verse-note="verse-note-${selectedChapter}-${n}" title="Zobrazit myšlenku k verši" aria-expanded="false">✦</button>`:""} </span>
                ${q?`<span class="verse-quote" id="verse-note-${selectedChapter}-${n}">${q}</span>`:""}
              `;
            }).join("")}
          </div>
        </section>
      `).join("")}

      <nav class="chapter-nav" aria-label="Navigace mezi kapitolami">
        <button id="prevChapter" ${selectedChapter<=1?"disabled":""}>← Předchozí kapitola</button>
        <button id="nextChapter" ${selectedChapter>=b.chapters?"disabled":""}>Další kapitola →</button>
      </nav>
    `;
    wireChapterInteractions(main);
    const prev=main.querySelector("#prevChapter");
    const next=main.querySelector("#nextChapter");
    if(prev) prev.onclick=()=>{
      if(selectedChapter>1){
        selectedChapter--;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
    if(next) next.onclick=()=>{
      if(selectedChapter<b.chapters){
        selectedChapter++;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
  } else {
    main.innerHTML=`
      <div class="eyebrow">Evangelium podle ${b.name}</div>
      <h2>${selectedChapter}. kapitola</h2>
      <div class="placeholder">
        Tato kapitola je zatím připravená ve struktuře aplikace, ale její modernizované znění ještě není vložené.
      </div>
      <nav class="chapter-nav" aria-label="Navigace mezi kapitolami">
        <button id="prevChapter" ${selectedChapter<=1?"disabled":""}>← Předchozí kapitola</button>
        <button id="nextChapter" ${selectedChapter>=b.chapters?"disabled":""}>Další kapitola →</button>
      </nav>`;
    const prev=main.querySelector("#prevChapter");
    const next=main.querySelector("#nextChapter");
    if(prev) prev.onclick=()=>{
      if(selectedChapter>1){
        selectedChapter--;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
    if(next) next.onclick=()=>{
      if(selectedChapter<b.chapters){
        selectedChapter++;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
  }
}

let currentCycle="A";
function renderSundayList(){
  const list=document.getElementById("sundayList");
  const entries=SUNDAYS[currentCycle];
  if(!entries.length){
    list.innerHTML='<div class="empty-cycle">V tomto cyklu zatím nejsou přidané žádné neděle.</div>';
    document.getElementById("archiveMain").innerHTML='<div class="placeholder">Vyber jiný cyklus nebo později přidej další přepis.</div>';
    return;
  }
  list.innerHTML=entries.map((s,i)=>`
    <button class="sunday-item ${i===0?"active":""}" data-sunday="${s.id}">
      <strong>${s.title}</strong>
      <span>${s.date} · ${s.gospel}</span>
    </button>`).join("");
  list.querySelectorAll(".sunday-item").forEach(btn=>btn.onclick=()=>{
    list.querySelectorAll(".sunday-item").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    renderSunday(btn.dataset.sunday);
  });
  renderSunday(entries[0].id);
}

function gospelExcerpt(ref){
  const match=ref.match(/^(Mt|Mk|Lk|Jan)\s+(\d+),(\d+)[–-](\d+)$/);
  if(!match)return "";
  const key={Mt:"MAT",Mk:"MRK",Lk:"LUK",Jan:"JHN"}[match[1]];
  const maps={MAT:MATTHEW_SECTIONS,MRK:MARK_SECTIONS,LUK:LUKE_SECTIONS,JHN:JOHN_SECTIONS};
  const verses=(maps[key][Number(match[2])]||[]).flatMap(section=>section.verses);
  const from=Number(match[3]),to=Number(match[4]);
  return verses.filter(([n])=>n>=from&&n<=to).map(([n,t])=>'<span class="verse-inline"><sup class="verse-number">'+n+'</sup>'+t+' </span>').join("");
}

function renderSunday(id){
  const s=Object.values(SUNDAYS).flat().find(x=>x.id===id);
  if(!s)return;
  document.getElementById("archiveMain").innerHTML=
    '<div class="sunday-head"><div class="eyebrow">Cyklus '+currentCycle+'</div><h2>'+s.title+'</h2><div class="sunday-meta"><span class="pill">'+s.date+'</span><span class="pill">'+s.gospel+'</span></div></div>'+
    '<section class="transcript-section"><h3>Evangelium · '+s.gospel+'</h3><div class="verse-flow">'+gospelExcerpt(s.gospel)+'</div></section>'+
    '<section class="video-panel"><h3>Video s myšlenkami</h3><div class="video-wrap"><iframe src="'+s.videoEmbed+'" title="Video s myšlenkami k evangeliu" allowfullscreen></iframe></div></section>';
}

document.querySelectorAll(".cycle-btn").forEach(btn=>btn.onclick=()=>{
  currentCycle=btn.dataset.cycle;
