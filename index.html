let selectedBook="MAT", selectedChapter=5;

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  document.querySelectorAll(".topnav button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
}
document.querySelectorAll(".topnav button[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));

const themeToggle=document.getElementById("themeToggle");
function applyTheme(mode){
  const dark=mode==="dark";
  document.body.classList.toggle("dark",dark);
  themeToggle.textContent=dark ? "☀ Světlý režim" : "☾ Tmavý režim";
}
const savedTheme=localStorage.getItem("evangelium_theme");
applyTheme(savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeToggle.onclick=()=>{
  const next=document.body.classList.contains("dark") ? "light" : "dark";
  localStorage.setItem("evangelium_theme",next);
  applyTheme(next);
};


function renderBookTree(){
  const host=document.getElementById("bookList");
  host.innerHTML="";
  Object.entries(BOOKS).forEach(([id,b])=>{
    const row=document.createElement("div");
    row.className="book-row";

    const btn=document.createElement("button");
    btn.className="book-btn"+(id===selectedBook?" active":"");
    btn.textContent=b.name;
    btn.onclick=()=>{
      if(id!==selectedBook) selectedChapter=1;
      selectedBook=id;
      renderBookTree();
      renderBible();
    };
    row.appendChild(btn);

    const chapters=document.createElement("div");
    chapters.className="chapters"+(id===selectedBook?" open":"");
    for(let i=1;i<=b.chapters;i++){
      const c=document.createElement("button");
      c.className="chapter-btn"+(id===selectedBook && i===selectedChapter?" active":"");
      c.textContent=i;
      c.onclick=()=>{
        selectedBook=id; selectedChapter=i;
        renderBookTree(); renderBible();
      };
      chapters.appendChild(c);
    }
    row.appendChild(chapters);
    host.appendChild(row);
  });
}

function openThought(id){
  currentCycle="A";
  document.querySelectorAll(".cycle-btn").forEach(x=>x.classList.toggle("active",x.dataset.cycle==="A"));
  showView("archiveView");
  renderSundayList();
  renderSunday("A-04-ordinary-2026",id);
}

function wireChapterInteractions(main){
  const closePassageExtras=()=>{
    main.querySelectorAll(".passage-thought-expanded,.passage-video-expanded").forEach(x=>x.classList.remove("open"));
    main.querySelectorAll("[data-inline-thought],[data-inline-video]").forEach(x=>x.classList.remove("active"));
  };

  main.querySelectorAll("[data-inline-thought]").forEach(btn=>{
    btn.onclick=()=>{
      const box=main.querySelector("#inline-"+btn.dataset.inlineThought);
      const wasOpen=box.classList.contains("open");
      closePassageExtras();
      if(!wasOpen){ box.classList.add("open"); btn.classList.add("active"); }
    };
  });

  main.querySelectorAll("[data-inline-video]").forEach(btn=>{
    btn.onclick=()=>{
      const box=main.querySelector("#inline-passage-video");
      const wasOpen=box.classList.contains("open");
      closePassageExtras();
      if(!wasOpen){ box.classList.add("open"); btn.classList.add("active"); }
    };
  });

  main.querySelectorAll("[data-verse-note]").forEach(btn=>{
    btn.onclick=()=>{
      const box=main.querySelector("#"+btn.dataset.verseNote);
      box.classList.toggle("open");
      btn.setAttribute("aria-expanded", box.classList.contains("open") ? "true" : "false");
    };
  });
}

function scrollToChapterText(){
  requestAnimationFrame(()=>{
    const target=document.querySelector("#bibleMain .passage-title") || document.querySelector("#bibleMain h2");
    if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
  });
}

              </div>
            </div>
          </div>` : ""}

          <div class="verse-flow">
            ${section.verses.map(([n,t])=>{
              const q=VERSE_QUOTES[`${selectedChapter}:${n}`];
              return `
                <span class="verse-inline"><sup class="verse-number">${n}</sup>${t}${q?`<button class="verse-note-marker" data-verse-note="verse-note-${selectedChapter}-${n}" title="Zobrazit myšlenku k verši" aria-expanded="false">✦</button>`:""} </span>
                ${q?`<span class="verse-quote" id="verse-note-${selectedChapter}-${n}">${q}</span>`:""}
              `;
            }).join("")}
          </div>
        </section>
      `).join("")}

      <nav class="chapter-nav" aria-label="Navigace mezi kapitolami">
        <button id="prevChapter" ${selectedChapter<=1?"disabled":""}>← Předchozí kapitola</button>
        <button id="nextChapter" ${selectedChapter>=b.chapters?"disabled":""}>Další kapitola →</button>
      </nav>
    `;
    wireChapterInteractions(main);
    const prev=main.querySelector("#prevChapter");
    const next=main.querySelector("#nextChapter");
    if(prev) prev.onclick=()=>{
      if(selectedChapter>1){
        selectedChapter--;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
    if(next) next.onclick=()=>{
      if(selectedChapter<b.chapters){
        selectedChapter++;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
  } else {
    main.innerHTML=`
      <div class="eyebrow">Evangelium podle ${b.name}</div>
      <h2>${selectedChapter}. kapitola</h2>
      <div class="placeholder">
        Tato kapitola je zatím připravená ve struktuře aplikace, ale její modernizované znění ještě není vložené.
      </div>
      <nav class="chapter-nav" aria-label="Navigace mezi kapitolami">
        <button id="prevChapter" ${selectedChapter<=1?"disabled":""}>← Předchozí kapitola</button>
        <button id="nextChapter" ${selectedChapter>=b.chapters?"disabled":""}>Další kapitola →</button>
      </nav>`;
    const prev=main.querySelector("#prevChapter");
    const next=main.querySelector("#nextChapter");
    if(prev) prev.onclick=()=>{
      if(selectedChapter>1){
        selectedChapter--;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
    if(next) next.onclick=()=>{
      if(selectedChapter<b.chapters){
        selectedChapter++;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
  }
}

let currentCycle="A";
function renderSundayList(){
  const list=document.getElementById("sundayList");
  const entries=SUNDAYS[currentCycle];
  if(!entries.length){
    list.innerHTML='<div class="empty-cycle">V tomto cyklu zatím nejsou přidané žádné neděle.</div>';
    document.getElementById("archiveMain").innerHTML='<div class="placeholder">Vyber jiný cyklus nebo později přidej další přepis.</div>';
    return;
  }
  list.innerHTML=entries.map((s,i)=>`
    <button class="sunday-item ${i===0?"active":""}" data-sunday="${s.id}">
      <strong>${s.title}</strong>
      <span>${s.date} · ${s.gospel}</span>
    </button>`).join("");
  list.querySelectorAll(".sunday-item").forEach(btn=>btn.onclick=()=>{
    list.querySelectorAll(".sunday-item").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    renderSunday(btn.dataset.sunday);
  });
  renderSunday(entries[0].id);
}

function renderSunday(id, scrollThought=null){
  const s=Object.values(SUNDAYS).flat().find(x=>x.id===id);
  if(!s)return;
  const main=document.getElementById("archiveMain");
  main.innerHTML=`
    <div class="sunday-head">
      <div class="eyebrow">Cyklus ${currentCycle}</div>
      <h2>${s.title}</h2>
      <div class="sunday-meta">
        <span class="pill">${s.date}</span>
        <span class="pill">${s.gospel}</span>
        <span class="pill">Libor Všetula</span>
      </div>
    </div>

    <section class="video-panel">
      <h3>Video</h3>
      <div class="video-wrap">
        <iframe
          id="videoFrame"
          src="https://www.youtube-nocookie.com/embed/9lovWV1zMtI"
          title="Libor Všetula – myšlenky k evangeliu"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
    </section>

    <section class="transcript-section">
      <h3>Úvod</h3>
      <p>${s.intro}</p>
    </section>

    ${s.thoughtIds.map(tid=>{
      const t=THOUGHTS[tid];
      return `<section class="transcript-section" id="archive-${tid}">
        <div class="timecode">${t.time}</div>
        <h3>${t.title}</h3>
        ${t.paragraphs.map(p=>`<p>${p}</p>`).join("")}
      </section>`;
    }).join("")}

    <section class="transcript-section">
      <h3>Závěr</h3>
      <p>${s.conclusion}</p>
    </section>

    <div class="editorial">
      Přepis je redakčně vyčištěný podle dodaných titulků: odstraněna je slovní vata, opakování,
      přeřeknutí a organizační závěr. Smysl jednotlivých myšlenek zůstává zachovaný.
    </div>
  `;

  if(scrollThought){
    requestAnimationFrame(()=>document.getElementById("archive-"+scrollThought)?.scrollIntoView({behavior:"smooth",block:"start"}));
  }
}

document.querySelectorAll(".cycle-btn").forEach(btn=>btn.onclick=()=>{
  currentCycle=btn.dataset.cycle;
  document.querySelectorAll(".cycle-btn").forEach(x=>x.classList.toggle("active",x===btn));
  renderSundayList();
});

renderBookTree();
renderBible();
renderSundayList();
</script>
