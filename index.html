<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myšlenky k evangeliu</title>
<style>
:root{
  --bg:#f5f2eb; --paper:#fffdf9; --ink:#25211c; --muted:#756e64;
  --line:#ddd5c8; --accent:#75562c; --soft:#f1e7d7; --soft2:#fbf6ed;
  --shadow:0 10px 34px rgba(53,43,30,.07); --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:24px}
header{margin:6px 0 20px}
h1,h2,h3{font-family:Georgia,serif;font-weight:600}
h1{font-size:clamp(31px,5vw,48px);margin:0 0 6px}
header p{margin:0;color:var(--muted)}
.topnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.topnav button,.cycle-btn{
  border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 15px;cursor:pointer
}
.topnav button.active,.cycle-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.view{display:none}.view.active{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* Bible tree */
.bible-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
.bible-nav{padding:16px}
.bible-nav h2{font-size:20px;margin:0 0 12px}
.book-list{display:grid;gap:8px}
.book-row{border:1px solid var(--line);background:white;border-radius:13px;overflow:hidden}
.book-btn{width:100%;text-align:left;border:0;background:white;padding:11px 12px;cursor:pointer;font-weight:700}
.book-btn.active{background:var(--soft)}
.chapters{display:none;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 9px 10px}
.chapters.open{display:grid}
.chapter-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 2px;cursor:pointer;font-size:13px}
.chapter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.bible-main{padding:clamp(18px,4vw,32px)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bible-main h2{font-size:32px;margin:5px 0}
.source-note{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}
.passage{border-top:1px solid var(--line);padding:18px 0 0;margin-top:18px}
.passage:first-of-type{border-top:0;margin-top:0;padding-top:0}
.passage-title{font-weight:800;margin-bottom:12px}
.passage-thoughts{
  border:1px solid #ddc9a7;background:var(--soft2);border-radius:15px;padding:14px 15px;margin:0 0 18px
}
.passage-thoughts strong{display:block;margin-bottom:9px}
.thought-links{display:flex;flex-wrap:wrap;gap:8px}
.thought-link{
  border:1px solid #ccb387;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px
}
.thought-link.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.verse{display:grid;grid-template-columns:38px 1fr;gap:10px;border-top:1px solid #eee7dc;padding:11px 0}
.verse:first-of-type{border-top:0}
.vn{font:700 13px Georgia,serif;color:var(--accent);padding-top:4px}
.vtext{font:20px/1.55 Georgia,serif}
.verse-quote{
  margin-top:9px;border-left:3px solid #c7a66f;background:#fff9ef;border-radius:0 12px 12px 0;
  padding:10px 13px;font:16px/1.55 Georgia,serif
}

.verse-note-marker{
  margin-top:8px;width:28px;height:28px;border-radius:50%;border:1px solid #d6bd91;
  background:#fff9ef;color:var(--accent);cursor:pointer;font-weight:800;line-height:1;
  display:inline-flex;align-items:center;justify-content:center
}
.verse-note-marker:hover{background:var(--soft)}
.verse-quote{display:none}
.verse-quote.open{display:block}
.passage-thought-expanded{
  display:none;margin-top:12px;border:1px solid #ddc9a7;background:#fffaf2;
  border-radius:14px;padding:15px 16px
}
.passage-thought-expanded.open{display:block}
.passage-thought-expanded h4{margin:0 0 10px;font-size:16px}
.passage-thought-expanded p{margin:0 0 10px;line-height:1.68}
.passage-thought-expanded p:last-child{margin-bottom:0}

.placeholder{text-align:center;color:var(--muted);padding:80px 20px;line-height:1.6}

/* Archive */
.archive-layout{display:grid;grid-template-columns:310px 1fr;gap:18px}
.archive-side{padding:17px}
.archive-main{padding:clamp(18px,4vw,32px);min-height:560px}
.archive-side h2{font-size:21px;margin:0 0 12px}
.cycles{display:flex;gap:7px;margin-bottom:18px}
.cycle-btn{padding:7px 13px}
.sunday-list{display:grid;gap:9px}
.sunday-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer}
.sunday-item.active{background:var(--soft);border-color:#c9ae82}
.sunday-item strong{display:block}
.sunday-item span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.empty-cycle{color:var(--muted);font-size:14px;line-height:1.5;padding:8px 2px}
.sunday-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:3px}
.sunday-head h2{font-size:32px;margin:5px 0}
.sunday-meta{color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}
.transcript-section{padding:22px 0;border-top:1px solid var(--line)}
.transcript-section:first-of-type{border-top:0}
.transcript-section h3{font-size:23px;margin:0 0 12px}
.transcript-section p{font-size:16px;line-height:1.75;margin:0 0 12px}
.transcript-section p:last-child{margin-bottom:0}
.timecode{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px}
.editorial{margin-top:18px;padding:12px 14px;background:#faf6ef;border:1px solid #e4dbcd;border-radius:13px;color:var(--muted);font-size:12px;line-height:1.55}
footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}

/* Compact Bible text */
.passage{padding-top:15px;margin-top:15px}
.passage-title{margin-bottom:9px}
.verse-flow{
  font-family:Georgia,serif;
  font-size:16px;
  line-height:1.72;
  color:var(--ink);
}
.verse-inline{display:inline}
.verse-inline + .verse-inline{margin-left:.18em}
.verse-number{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:.68em;
  line-height:0;
  vertical-align:super;
  color:var(--accent);
  font-weight:800;
  margin-right:.28em;
}
.verse-note-marker{
  display:inline;
  width:auto;height:auto;
  margin:0 0 0 .18em;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  color:var(--accent);
  font-size:.82em;
  line-height:1;
  vertical-align:baseline;
  cursor:pointer;
  font-weight:800;
}
.verse-note-marker:hover{background:transparent;opacity:.7}
.verse-quote{
  display:none;
  margin:9px 0 12px;
  border-left:3px solid #c7a66f;
  background:#fff9ef;
  border-radius:0 12px 12px 0;
  padding:10px 13px;
  font:16px/1.55 Georgia,serif;
}
.verse-quote.open{display:block}
.chapter-nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.chapter-nav button{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}
.chapter-nav button:hover{background:var(--soft)}
.chapter-nav button:disabled{opacity:.35;cursor:default}
.theme-toggle{
  margin-left:auto;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:999px;
  padding:9px 14px;
  cursor:pointer;
}

/* Dark mode */
body.dark{
  --bg:#161513;
  --paper:#211f1c;
  --ink:#eee9df;
  --muted:#aaa398;
  --line:#3c3832;
  --accent:#d3aa70;
  --soft:#30291f;
  --soft2:#29251f;
  --shadow:0 10px 34px rgba(0,0,0,.22);
}
body.dark .card,
body.dark .book-row,
body.dark .book-btn,
body.dark .chapter-btn,
body.dark .sunday-item,
body.dark .pill,
body.dark .thought-link,
body.dark .cycle-btn,
body.dark .topnav button,
body.dark .chapter-nav button,
body.dark .theme-toggle,
body.dark .video-tools input,
body.dark .video-tools button{
  background:var(--paper);
  color:var(--ink);
  border-color:var(--line);
}
body.dark .book-btn.active,
body.dark .sunday-item.active{background:var(--soft)}
body.dark .chapter-btn.active,
body.dark .cycle-btn.active,
body.dark .topnav button.active,
body.dark .thought-link.active{
  background:var(--ink);
  color:#161513;
  border-color:var(--ink);
}
body.dark .passage-thoughts,
body.dark .passage-thought-expanded,
body.dark .verse-quote{
  background:#28231c;
  border-color:#5a4934;
}
body.dark .editorial,
body.dark .video-panel{background:#1d1b18}
body.dark .video-wrap{background:#111}
.theme-toggle-fixed{position:fixed;top:14px;right:14px;z-index:1000;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.passage-title{scroll-margin-top:16px}
.passage-video-expanded{display:none;margin-top:12px;border:1px solid #ddc9a7;background:#fffaf2;border-radius:14px;padding:14px}
.passage-video-expanded.open{display:block}
.passage-video-expanded .video-wrap{margin:0}
body.dark .passage-video-expanded{background:#28231c;border-color:#5a4934}
@media(max-width:650px){.theme-toggle-fixed{top:9px;right:9px;padding:8px 10px;font-size:13px}header{padding-top:38px}}



.video-panel{margin:20px 0 6px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbf8f2}
.video-panel h3{margin:0 0 12px;font-size:20px}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#ede8df;border-radius:13px;overflow:hidden}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.video-missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);line-height:1.5}
.video-tools{display:flex;gap:8px;margin-top:10px}
.video-tools input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:white}
.video-tools button{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 12px;cursor:pointer;font-weight:700}
.video-help{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}


@media(max-width:820px){
  .app{padding:13px}
  .bible-layout,.archive-layout{grid-template-columns:1fr}
  .verse-flow{font-size:16px;line-height:1.68}
  .chapter-nav button{flex:1;padding:10px 8px}
  .chapters{grid-template-columns:repeat(7,1fr)}
}
</style>
</head>
<body>
<div class="app">
<button class="theme-toggle theme-toggle-fixed" id="themeToggle" type="button">☾ Tmavý režim</button>

<header>
  <h1>Myšlenky k evangeliu</h1>
  <p>Evangelia propojená s vyčištěnými přepisy jednotlivých neděl.</p>
</header>

<nav class="topnav">
  <button class="active" data-view="gospelView">Evangelia</button>
  <button data-view="archiveView">Myšlenky k evangeliu</button>
</nav>

<section id="gospelView" class="view active">
  <div class="bible-layout">
    <aside class="card bible-nav">
      <h2>Evangelia</h2>
      <div id="bookList" class="book-list"></div>
    </aside>
    <main class="card bible-main" id="bibleMain"></main>
  </div>
</section>

<section id="archiveView" class="view">
  <div class="archive-layout">
    <aside class="card archive-side">
      <h2>Myšlenky k evangeliu</h2>
      <div class="cycles">
        <button class="cycle-btn active" data-cycle="A">Cyklus A</button>
        <button class="cycle-btn" data-cycle="B">Cyklus B</button>
        <button class="cycle-btn" data-cycle="C">Cyklus C</button>
      </div>
      <div id="sundayList" class="sunday-list"></div>
    </aside>
    <main class="card archive-main" id="archiveMain"></main>
  </div>
</section>

<footer>Pracovní prototyp · modernizované znění podle Bible kralické.</footer>
</div>

<script>

m ukázal, jak uniknout přicházejícímu hněvu?“"],[8,"„Neste tedy ovoce, které odpovídá pokání.“"],[9,"„A neříkejte si: Naším otcem je Abraham. Říkám vám, že Bůh může Abrahamovi vzbudit děti i z těchto kamenů.“"],[10,"„Sekera už leží u kořene stromů. Každý strom, který nenese dobré ovoce, bude vyťat a hozen do ohně.“"],[11,"„Já vás křtím vodou k pokání. Ten, kdo přichází po mně, je však mocnější než já; nejsem hoden ani nosit jeho obuv. On vás bude křtít Duchem svatým a ohněm.“"],[12,"„V ruce má lopatu, vyčistí svůj mlat, pšenici shromáždí do sýpky, ale plevy spálí neuhasitelným ohněm.“"]]},{"title":"Ježíšův křest","range":"Mt 3,13–17","thoughts":[],"verses":[[13,"Tehdy přišel Ježíš z Galileje k Jordánu za Janem, aby se od něho dal pokřtít."],[14,"Jan mu v tom bránil a říkal: „Já potřebuji být pokřtěn od tebe, a ty přicházíš ke mně?“"],[15,"Ježíš mu odpověděl: „Teď to nech tak. Takto se sluší naplnit všechnu spravedlnost.“ Jan mu tedy vyhověl."],[16,"Když byl Ježíš pokřtěn, hned vystoupil z vody. Otevřela se mu nebesa a uviděl Božího Ducha, jak sestupuje jako holubice a přichází na něj."],[17,"A z nebe zazněl hlas: „Toto je můj milovaný Syn, v němž mám zalíbení.“"]]}],"4":[{"title":"Pokušení na poušti","range":"Mt 4,1–11","thoughts":[],"verses":[[1,"Potom byl Ježíš Duchem veden na poušť, aby byl pokoušen ďáblem."],[2,"Postil se čtyřicet dní a čtyřicet nocí a potom dostal hlad."],[3,"Přišel k němu pokušitel a řekl: „Jsi-li Boží Syn, řekni, ať se z těchto kamenů stanou chleby.“"],[4,"Ježíš odpověděl: „Je napsáno: Člověk nebude žít jen chlebem, ale každým slovem, které vychází z Božích úst.“"],[5,"Potom ho ďábel vzal do svatého města a postavil ho na vrchol chrámu."],[6,"Řekl mu: „Jsi-li Boží Syn, vrhni se dolů. Vždyť je napsáno: Svým andělům o tobě přikáže a oni tě vezmou na ruce, abys nenarazil nohou o kámen.“"],[7,"Ježíš mu odpověděl: „Také je napsáno: Nebudeš pokoušet Pána, svého Boha.“"],[8,"Potom ho ďábel vzal na velmi vysokou horu a ukázal mu všechna království světa a jejich slávu."],[9,"Řekl mu: „To všechno ti dám, jestliže padneš na zem a pokloníš se mi.“"],[10,"Ježíš mu řekl: „Odejdi, satane! Je napsáno: Pánu, svému Bohu, se budeš klanět a jemu jedinému budeš sloužit.“"],[11,"Tehdy ho ďábel opustil a přišli andělé a sloužili mu."]]},{"title":"Začátek Ježíšova působení v Galileji","range":"Mt 4,12–17","thoughts":[],"verses":[[12,"Když Ježíš uslyšel, že byl Jan uvězněn, odešel do Galileje."],[13,"Opustil Nazaret a usadil se v Kafarnaum u jezera, na území Zabulona a Neftalíma,"],[14,"aby se naplnilo, co bylo řečeno skrze proroka Izaiáše:"],[15,"„Země Zabulon a země Neftalím, cesta k moři, za Jordánem, Galilea pohanů —"],[16,"lid, který seděl v temnotě, uviděl veliké světlo; těm, kdo seděli v krajině a stínu smrti, vzešlo světlo.“"],[17,"Od té doby začal Ježíš kázat: „Čiňte pokání, protože se přiblížilo nebeské království.“"]]},{"title":"Povolání prvních učedníků","range":"Mt 4,18–22","thoughts":[],"verses":[[18,"Když Ježíš procházel podél Galilejského jezera, uviděl dva bratry: Šimona zvaného Petr a jeho bratra Ondřeje. Vrhali síť do jezera, protože byli rybáři."],[19,"Řekl jim: „Pojďte za mnou a udělám z vás rybáře lidí.“"],[20,"Oni hned nechali sítě a šli za ním."],[21,"Když šel dál, uviděl jiné dva bratry, Jakuba, syna Zebedeova, a jeho bratra Jana. Byli na lodi se svým otcem Zebedeem a spravovali sítě. Ježíš je zavolal."],[22,"Oni hned opustili loď i svého otce a šli za ním."]]},{"title":"Ježíš učí a uzdravuje","range":"Mt 4,23–25","thoughts":[],"verses":[[23,"Ježíš procházel celou Galilejí, učil v jejich synagogách, hlásal evangelium o království a uzdravoval mezi lidmi každou nemoc a každý neduh."],[24,"Zpráva o něm se rozšířila po celé Sýrii. Přiváděli k němu všechny nemocné, lidi sužované různými nemocemi a bolestmi, posedlé, náměsíčné i ochrnuté, a on je uzdravoval."],[25,"Šly za ním veliké zástupy z Galileje, Desetiměstí, Jeruzaléma, Judska i ze Zajordání."]]}]};

MATTHEW_SECTIONS[6] = [{"title":"Skrytá zbožnost","range":"Mt 6,1–4","thoughts":[],"verses":[[1,"Dávejte si pozor, abyste své dobré skutky nekonali před lidmi jen proto, aby vás viděli. Jinak nemáte odměnu u svého Otce v nebesích."],[2,"Když tedy dáváš almužnu, nevytrubuj to před sebou jako pokrytci v synagogách a na ulicích, aby je lidé chválili. Amen, říkám vám: Ti už svou odměnu dostali."],[3,"Když dáváš almužnu, ať tvá levá ruka neví, co dělá pravá,"],[4,"aby tvá almužna zůstala skrytá. A tvůj Otec, který vidí i to, co je skryté, ti odplatí."]]},{"title":"O modlitbě","range":"Mt 6,5–8","thoughts":[],"verses":[[5,"Když se modlíš, nebuď jako pokrytci. Ti se rádi modlí v synagogách a na rozích ulic, aby je lidé viděli. Amen, říkám vám: Ti už svou odměnu dostali."],[6,"Když se však modlíš ty, vejdi do svého pokoje, zavři dveře a modli se ke svému Otci, který je ve skrytosti. A tvůj Otec, který vidí i to, co je skryté, ti odplatí."],[7,"Když se modlíte, nehromaďte prázdná slova jako pohané. Ti si myslí, že budou vyslyšeni pro množství svých slov."],[8,"Nebojte se jim podobat. Váš Otec ví, co potřebujete, ještě dříve, než ho o to požádáte."]]},{"title":"Otče náš","range":"Mt 6,9–15","thoughts":[],"verses":[[9,"Vy se tedy modlete takto: Otče náš, který jsi v nebesích, ať je posvěceno tvé jméno."],[10,"Ať přijde tvé království. Ať se děje tvá vůle jako v nebi, tak i na zemi."],[11,"Dej nám dnes náš každodenní chléb."],[12,"A odpusť nám naše viny, jako i my odpouštíme těm, kdo se provinili proti nám."],[13,"A neuveď nás do pokušení, ale vysvoboď nás od zlého. Vždyť tvé je království, moc i sláva navěky. Amen."],[14,"Jestliže totiž odpustíte lidem jejich provinění, odpustí i vám váš nebeský Otec."],[15,"Jestliže však lidem neodpustíte, ani váš Otec vám neodpustí vaše provinění."]]},{"title":"O postu","range":"Mt 6,16–18","thoughts":[],"verses":[[16,"Když se postíte, netvařte se zachmuřeně jako pokrytci. Ti dávají najevo svůj půst svým vzhledem, aby lidé viděli, že se postí. Amen, říkám vám: Ti už svou odměnu dostali."],[17,"Když se postíš ty, uprav si hlavu a umyj si tvář,"],[18,"aby nebylo lidem zjevné, že se postíš, ale jen tvému Otci, který je ve skrytosti. A tvůj Otec, který vidí i to, co je skryté, ti odplatí."]]},{"title":"Poklad v nebi","range":"Mt 6,19–24","thoughts":[],"verses":[[19,"Neshromažďujte si poklady na zemi, kde je ničí mol a rez a kde se zloději vloupávají a kradou."],[20,"Shromažďujte si však poklady v nebi, kde je mol ani rez neničí a kde se zloději nevloupávají ani nekradou."],[21,"Protože kde je tvůj poklad, tam bude i tvé srdce."],[22,"Lampou těla je oko. Je-li tedy tvé oko čisté, celé tvé tělo bude ve světle."],[23,"Je-li však tvé oko špatné, celé tvé tělo bude ve tmě. Jestliže je tedy světlo, které je v tobě, tmou, jak veliká ta tma bude!"],[24,"Nikdo nemůže sloužit dvěma pánům. Jednoho totiž bude nenávidět a druhého milovat, nebo se jednoho bude držet a druhým pohrdne. Nemůžete sloužit Bohu i majetku."]]},{"title":"Nestarejte se úzkostlivě o zítřek","range":"Mt 6,25–34","thoughts":[],"verses":[[25,"Proto vám říkám: Nedělejte si úzkostlivé starosti o svůj život, co budete jíst a pít, ani o své tělo, co si obléknete. Není život víc než jídlo a tělo víc než oděv?"],[26,"Podívejte se na nebeské ptáky: nesejí, nežnou ani neshromažďují do stodol, a přesto je váš nebeský Otec živí. Nejste snad mnohem cennější než oni?"],[27,"Kdo z vás může svou starostí prodloužit svůj život byť jen o jediný loket?"],[28,"A proč si děláte starosti o oděv? Podívejte se na polní květiny, jak rostou. Nepracují ani nepředou."],[29,"A přesto vám říkám, že ani Šalomoun v celé své slávě nebyl oblečen jako jedna z nich."],[30,"Jestliže Bůh tak obléká polní trávu, která dnes je a zítra se hodí do pece, neobleče tím spíš vás, lidé malé víry?"],[31,"Nedělejte si tedy starosti a neříkejte: Co budeme jíst? Co budeme pít? Co si oblečeme?"],[32,"Po tom všem se shánějí pohané. Váš nebeský Otec přece ví, že to všechno potřebujete."],[33,"Hledejte nejprve Boží království a jeho spravedlnost, a všechno ostatní vám bude přidáno."],[34,"Nedělejte si tedy starosti o zítřek. Zítřek bude mít své vlastní starosti. Každý den má dost svého trápení."]]}];
MATTHEW_SECTIONS[7] = [{"title":"Nesuďte","range":"Mt 7,1–6","thoughts":[],"verses":[[1,"Nesuďte, abyste nebyli souzeni."],[2,"Jakým soudem soudíte, takovým budete souzeni; a jakou mírou měříte, takovou bude naměřeno i vám."],[3,"Proč vidíš třísku v oku svého bratra, ale trámu ve vlastním oku si nevšímáš?"],[4,"Jak můžeš říct svému bratru: Dovol, ať ti vyjmu třísku z oka, když máš sám v oku trám?"],[5,"Pokrytče, nejprve vyjmi trám ze svého oka. Potom uvidíš jasně a budeš moci vyjmout třísku z oka svého bratra."],[6,"Nedávejte to, co je svaté, psům a neházejte své perly před prasata, aby je nepošlapala a potom se neobrátila proti vám."]]},{"title":"Proste, hledejte, tlučte","range":"Mt 7,7–12","thoughts":[],"verses":[[7,"Proste, a bude vám dáno. Hledejte, a naleznete. Tlučte, a bude vám otevřeno."],[8,"Každý, kdo prosí, dostává; kdo hledá, nalézá; a tomu, kdo tluče, bude otevřeno."],[9,"Kdo z vás by dal svému synovi kámen, kdyby ho prosil o chléb?"],[10,"Nebo kdyby prosil o rybu, dal by mu hada?"],[11,"Jestliže tedy vy, ačkoli jste zlí, umíte dávat svým dětem dobré dary, tím spíš váš Otec v nebesích dá dobré věci těm, kdo ho prosí."],[12,"Všechno, co chcete, aby lidé dělali vám, dělejte i vy jim. V tom je Zákon i Proroci."]]},{"title":"Úzká brána","range":"Mt 7,13–14","thoughts":[],"verses":[[13,"Vcházejte úzkou branou. Široká je brána a prostorná cesta, která vede do záhuby, a mnoho lidí po ní jde."],[14,"Úzká je však brána a těsná cesta, která vede k životu, a málo je těch, kdo ji nalézají."]]},{"title":"Strom se pozná po ovoci","range":"Mt 7,15–20","thoughts":[],"verses":[[15,"Dávejte si pozor na falešné proroky. Přicházejí k vám v ovčím rouchu, ale uvnitř jsou draví vlci."],[16,"Poznáte je podle jejich ovoce. Sbírají se snad hrozny z trní nebo fíky z bodláčí?"],[17,"Každý dobrý strom nese dobré ovoce, ale špatný strom nese špatné ovoce."],[18,"Dobrý strom nemůže nést špatné ovoce a špatný strom nemůže nést dobré ovoce."],[19,"Každý strom, který nenese dobré ovoce, je vyťat a hozen do ohně."],[20,"Proto je poznáte podle jejich ovoce."]]},{"title":"Ne každý, kdo říká: Pane, Pane","range":"Mt 7,21–23","thoughts":[],"verses":[[21,"Ne každý, kdo mi říká: Pane, Pane, vejde do nebeského království, ale ten, kdo koná vůli mého Otce v nebesích."],[22,"Mnozí mi v onen den řeknou: Pane, Pane, copak jsme ve tvém jménu neprorokovali, ve tvém jménu nevyháněli démony a ve tvém jménu nekonali mnoho mocných činů?"],[23,"Tehdy jim řeknu otevřeně: Nikdy jsem vás neznal. Odejděte ode mě, vy, kdo pácháte nepravost."]]},{"title":"Dům na skále","range":"Mt 7,24–29","thoughts":[],"verses":[[24,"Každý, kdo slyší tato má slova a plní je, podobá se moudrému muži, který postavil svůj dům na skále."],[25,"Spustil se déšť, přivalily se vody, zvedly se větry a udeřily na ten dům, ale nespadl, protože měl základy na skále."],[26,"Každý, kdo slyší tato má slova a neplní je, podobá se nerozumnému muži, který postavil svůj dům na písku."],[27,"Spustil se déšť, přivalily se vody, zvedly se větry a udeřily na ten dům. Ten spadl a jeho pád byl veliký."],[28,"Když Ježíš dokončil tato slova, zástupy žasly nad jeho učením,"],[29,"protože je učil jako ten, kdo má autoritu, a ne jako jejich učitelé Zákona."]]}];
MATTHEW_SECTIONS[8] = [{"title":"Uzdravení malomocného","range":"Mt 8,1–4","thoughts":[],"verses":[[1,"Když Ježíš sestoupil z hory, šly za ním veliké zástupy."],[2,"Tu k němu přišel malomocný, poklonil se mu a řekl: „Pane, jestli chceš, můžeš mě očistit.“"],[3,"Ježíš vztáhl ruku, dotkl se ho a řekl: „Chci. Buď čistý.“ A jeho malomocenství bylo okamžitě očištěno."],[4,"Ježíš mu řekl: „Nikomu o tom neříkej. Jdi, ukaž se knězi a přines oběť, kterou přikázal Mojžíš, na svědectví pro ně.“"]]},{"title":"Víra setníka","range":"Mt 8,5–13","thoughts":[],"verses":[[5,"Když Ježíš vstoupil do Kafarnaum, přišel k němu setník a prosil ho:"],[6,"„Pane, můj služebník leží doma ochrnutý a velmi trpí.“"],[7,"Ježíš mu řekl: „Přijdu a uzdravím ho.“"],[8,"Setník odpověděl: „Pane, nejsem hoden, abys vešel pod mou střechu. Jen řekni slovo, a můj služebník bude uzdraven.“"],[9,"„Vždyť i já podléhám autoritě a mám pod sebou vojáky. Řeknu jednomu: Jdi, a jde; jinému: Přijď, a přijde; svému služebníkovi: Udělej to, a udělá.“"],[10,"Když to Ježíš uslyšel, podivil se a řekl těm, kdo šli za ním: „Amen, říkám vám: Tak velikou víru jsem nenašel ani v Izraeli.“"],[11,"„Říkám vám, že mnozí přijdou od východu i západu a budou stolovat s Abrahamem, Izákem a Jákobem v nebeském království,“"],[12,"„ale synové království budou vyhozeni ven do tmy. Tam bude pláč a skřípění zubů.“"],[13,"Potom Ježíš řekl setníkovi: „Jdi. Ať se ti stane, jak jsi uvěřil.“ A jeho služebník byl v tu chvíli uzdraven."]]},{"title":"Uzdravení v Petrově domě","range":"Mt 8,14–17","thoughts":[],"verses":[[14,"Ježíš přišel do Petrova domu a uviděl jeho tchyni ležet v horečce."],[15,"Dotkl se její ruky, horečka ji opustila, ona vstala a začala jim sloužit."],[16,"Když nastal večer, přivedli k němu mnoho posedlých. On slovem vyháněl duchy a uzdravil všechny nemocné,"],[17,"aby se naplnilo, co bylo řečeno skrze proroka Izaiáše: „On vzal na sebe naše slabosti a nesl naše nemoci.“"]]},{"title":"Následování Ježíše","range":"Mt 8,18–22","thoughts":[],"verses":[[18,"Když Ježíš uviděl kolem sebe zástupy, přikázal přeplavit se na druhou stranu."],[19,"Přišel k němu jeden učitel Zákona a řekl: „Mistře, půjdu za tebou, kamkoli půjdeš.“"],[20,"Ježíš mu odpověděl: „Lišky mají doupata a nebeští ptáci hnízda, ale Syn člověka nemá, kde by hlavu složil.“"],[21,"Jiný z jeho učedníků mu řekl: „Pane, dovol mi nejprve odejít a pochovat svého otce.“"],[22,"Ježíš mu řekl: „Následuj mě a nech mrtvé, ať pochovávají své mrtvé.“"]]},{"title":"Utišení bouře","range":"Mt 8,23–27","thoughts":[],"verses":[[23,"Ježíš nastoupil na loď a jeho učedníci šli s ním."],[24,"Na jezeře se náhle strhla veliká bouře, takže vlny zaplavovaly loď. Ježíš však spal."],[25,"Učedníci k němu přišli, probudili ho a volali: „Pane, zachraň nás, hyneme!“"],[26,"Řekl jim: „Proč se bojíte, lidé malé víry?“ Potom vstal, pohrozil větrům i jezeru a nastalo veliké ticho."],[27,"Lidé žasli a říkali: „Kdo to je, že ho poslouchají i větry a jezero?“"]]},{"title":"Dva posedlí v krajině Gergesenů","range":"Mt 8,28–34","thoughts":[],"verses":[[28,"Když se Ježíš dostal na druhý břeh do krajiny Gergesenů, vyšli mu vstříc dva posedlí, kteří vycházeli z hrobů. Byli tak nebezpeční, že tou cestou nikdo nemohl procházet."],[29,"Začali křičet: „Co je ti po nás, Ježíši, Synu Boží? Přišel jsi nás trápit dřív, než nastal čas?“"],[30,"Nedaleko od nich se páslo veliké stádo prasat."],[31,"Démoni ho prosili: „Jestli nás vyháníš, dovol nám vejít do toho stáda prasat.“"],[32,"Řekl jim: „Jděte.“ Oni vyšli a vešli do prasat. Celé stádo se pak prudce vrhlo ze svahu do jezera a ve vodě zahynulo."],[33,"Pasáci utekli do města a všechno tam vyprávěli, včetně toho, co se stalo posedlým."],[34,"Celé město vyšlo Ježíšovi naproti. Když ho uviděli, prosili ho, aby z jejich kraje odešel."]]}];
MATTHEW_SECTIONS[9] = [{"title":"Uzdravení ochrnutého a odpuštění hříchů","range":"Mt 9,1–8","thoughts":[],"verses":[[1,"Ježíš nastoupil na loď, přeplavil se a přišel do svého města."],[2,"Přinesli k němu ochrnutého člověka ležícího na lůžku. Když Ježíš viděl jejich víru, řekl ochrnutému: „Buď dobré mysli, synu. Tvé hříchy jsou ti odpuštěny.“"],[3,"Někteří učitelé Zákona si pomysleli: „Ten člověk se rouhá.“"],[4,"Ježíš znal jejich myšlenky a řekl: „Proč ve svých srdcích myslíte na zlé?“"],[5,"„Co je snazší říct: Tvé hříchy jsou ti odpuštěny, nebo: Vstaň a choď?“"],[6,"„Abyste však věděli, že Syn člověka má na zemi moc odpouštět hříchy…“ Potom řekl ochrnutému: „Vstaň, vezmi své lůžko a jdi domů.“"],[7,"On vstal a odešel domů."],[8,"Když to zástupy viděly, žasly a oslavovaly Boha, který dal lidem takovou moc."]]},{"title":"Povolání Matouše","range":"Mt 9,9–13","thoughts":[],"verses":[[9,"Když Ježíš odcházel, uviděl člověka jménem Matouš sedět v celnici. Řekl mu: „Následuj mě.“ Matouš vstal a šel za ním."],[10,"Když potom Ježíš seděl v domě u stolu, přišlo mnoho celníků a hříšníků a jedli s ním a s jeho učedníky."],[11,"Když to viděli farizeové, řekli jeho učedníkům: „Proč váš učitel jí s celníky a hříšníky?“"],[12,"Ježíš to uslyšel a řekl: „Lékaře nepotřebují zdraví, ale nemocní.“"],[13,"„Jděte a naučte se, co znamená: Milosrdenství chci, ne oběť. Nepřišel jsem totiž volat spravedlivé, ale hříšníky k pokání.“"]]},{"title":"Otázka půstu","range":"Mt 9,14–17","thoughts":[],"verses":[[14,"Potom k němu přišli Janovi učedníci a ptali se: „Proč se my i farizeové často postíme, ale tvoji učedníci se nepostí?“"],[15,"Ježíš jim řekl: „Mohou se svatební hosté rmoutit, dokud je ženich s nimi? Přijdou však dny, kdy jim bude ženich vzat, a tehdy se budou postit.“"],[16,"Nikdo nepřišívá záplatu z nového sukna na starý oděv. Nová záplata by látku stáhla a díra by se ještě zvětšila."],[17,"Ani se nové víno nelije do starých měchů. Jinak měchy prasknou, víno se vylije a měchy se zničí. Nové víno se lije do nových měchů, a tak se zachová obojí."]]},{"title":"Dívka a nemocná žena","range":"Mt 9,18–26","thoughts":[],"verses":[[18,"Když k nim Ježíš takto mluvil, přišel jeden představený, poklonil se mu a řekl: „Moje dcera právě zemřela. Ale pojď, vlož na ni ruku a bude žít.“"],[19,"Ježíš vstal a šel za ním spolu se svými učedníky."],[20,"Tu k němu zezadu přistoupila žena, která dvanáct let trpěla krvácením, a dotkla se okraje jeho oděvu."],[21,"Říkala si totiž: „Jestli se jen dotknu jeho oděvu, budu uzdravena.“"],[22,"Ježíš se otočil, uviděl ji a řekl: „Buď dobré mysli, dcero. Tvá víra tě uzdravila.“ A od té chvíle byla žena zdravá."],[23,"Když Ježíš přišel do domu představeného a uviděl hudebníky a hlučící zástup,"],[24,"řekl: „Odejděte. Ta dívka nezemřela, ale spí.“ Oni se mu vysmívali."],[25,"Když zástup vyvedli ven, Ježíš vešel dovnitř, vzal dívku za ruku a ona vstala."],[26,"Zpráva o tom se rozšířila po celém tom kraji."]]},{"title":"Uzdravení dvou slepých","range":"Mt 9,27–31","thoughts":[],"verses":[[27,"Když Ježíš odcházel, šli za ním dva slepí a volali: „Smiluj se nad námi, Synu Davidův!“"],[28,"Když vešel do domu, slepí k němu přišli. Ježíš se jich zeptal: „Věříte, že to mohu udělat?“ Odpověděli: „Ano, Pane.“"],[29,"Potom se dotkl jejich očí a řekl: „Ať se vám stane podle vaší víry.“"],[30,"Jejich oči se otevřely. Ježíš je přísně varoval: „Dejte pozor, ať se o tom nikdo nedozví.“"],[31,"Oni však odešli a rozšířili zprávu o něm po celém kraji."]]},{"title":"Uzdravení němého","range":"Mt 9,32–34","thoughts":[],"verses":[[32,"Když odcházeli, přivedli k Ježíšovi němého člověka posedlého démonem."],[33,"Když byl démon vyhnán, němý začal mluvit. Zástupy žasly a říkaly: „Něco takového ještě nikdy v Izraeli vidět nebylo.“"],[34,"Farizeové však říkali: „Démony vyhání mocí vládce démonů.“"]]},{"title":"Žeň je veliká","range":"Mt 9,35–38","thoughts":[],"verses":[[35,"Ježíš procházel všechna města a vesnice, učil v jejich synagogách, hlásal evangelium o království a uzdravoval každou nemoc a každý neduh."],[36,"Když viděl zástupy, bylo mu jich líto, protože byli unavení a rozptýlení jako ovce bez pastýře."],[37,"Tehdy řekl svým učedníkům: „Žeň je veliká, ale dělníků je málo.“"],[38,"„Proste proto Pána žně, aby poslal dělníky na svou žeň.“"]]}];
MATTHEW_SECTIONS[10] = [{"title":"Dvanáct apoštolů","range":"Mt 10,1–4","thoughts":[],"verses":[[1,"Ježíš svolal svých dvanáct učedníků a dal jim moc nad nečistými duchy, aby je vyháněli, a moc uzdravovat každou nemoc a každý neduh."],[2,"Jména dvanácti apoštolů jsou tato: první Šimon, nazývaný Petr, a jeho bratr Ondřej; Jakub, syn Zebedeův, a jeho bratr Jan;"],[3,"Filip a Bartoloměj; Tomáš a celník Matouš; Jakub, syn Alfeův, a Lebbeus zvaný Tadeáš;"],[4,"Šimon Kananejský a Jidáš Iškariotský, který ho později zradil."]]},{"title":"Vyslání Dvanácti","range":"Mt 10,5–15","thoughts":[],"verses":[[5,"Těchto dvanáct Ježíš poslal a přikázal jim: „Nevydávejte se k pohanům a nevcházejte do samařských měst.“"],[6,"„Jděte raději ke ztraceným ovcím z domu Izraele.“"],[7,"„Cestou kažte: Přiblížilo se nebeské království.“"],[8,"„Uzdravujte nemocné, očišťujte malomocné, křiste mrtvé a vyhánějte démony. Zadarmo jste dostali, zadarmo dávejte.“"],[9,"„Neberte si do opasků zlato, stříbro ani peníze,“"],[10,"„ani brašnu na cestu, ani dvě košile, obuv navíc nebo hůl. Dělník si totiž zaslouží svůj pokrm.“"],[11,"„Když přijdete do nějakého města nebo vesnice, zjistěte, kdo je tam spolehlivý, a u něho zůstaňte, dokud neodejdete.“"],[12,"„Když vstoupíte do domu, pozdravte ho.“"],[13,"„Jestliže si ten dům zaslouží pokoj, ať na něj váš pokoj spočine. Jestliže ne, ať se váš pokoj vrátí k vám.“"],[14,"„Kdo vás nepřijme a nebude poslouchat vaše slova, odejděte z toho domu nebo města a setřeste prach ze svých nohou.“"],[15,"„Amen, říkám vám: Sodomě a Gomoře bude v den soudu snesitelněji než tomu městu.“"]]},{"title":"Ovce mezi vlky","range":"Mt 10,16–23","thoughts":[],"verses":[[16,"„Posílám vás jako ovce mezi vlky. Buďte proto obezřetní jako hadi a nevinní jako holubice.“"],[17,"„Dávejte si pozor na lidi. Budou vás vydávat soudům a ve svých synagogách vás budou bičovat.“"],[18,"„Kvůli mně vás budou vodit před vládce i krále, abyste vydali svědectví jim i národům.“"],[19,"„Když vás vydají, nedělejte si starosti, jak nebo co budete mluvit. V tu chvíli vám bude dáno, co máte říct.“"],[20,"„Nebudete totiž mluvit jen vy, ale Duch vašeho Otce bude mluvit ve vás.“"],[21,"„Bratr vydá na smrt bratra a otec dítě. Děti povstanou proti rodičům a budou je usmrcovat.“"],[22,"„Kvůli mému jménu vás budou všichni nenávidět. Kdo však vytrvá až do konce, bude zachráněn.“"],[23,"„Když vás budou pronásledovat v jednom městě, utečte do jiného. Amen, říkám vám: Nestačíte projít izraelská města, než přijde Syn člověka.“"]]},{"title":"Nebojte se","range":"Mt 10,24–33","thoughts":[],"verses":[[24,"„Učedník není nad svého učitele ani služebník nad svého pána.“"],[25,"„Učedníkovi stačí, když je jako jeho učitel, a služebníkovi, když je jako jeho pán. Jestliže nazvali pána domu Belzebubem, tím spíš tak budou nazývat jeho domácí.“"],[26,"„Nebojte se jich. Není nic skrytého, co nebude odhaleno, ani nic tajného, co nebude poznáno.“"],[27,"„Co vám říkám ve tmě, říkejte na světle; a co slyšíte do ucha, hlásejte ze střech.“"],[28,"„Nebojte se těch, kdo zabíjejí tělo, ale duši zabít nemohou. Spíš mějte bázeň před tím, který může zahubit duši i tělo v pekle.“"],[29,"„Neprodávají se dva vrabci za drobnou minci? A přece ani jeden z nich nepadne na zem bez vědomí vašeho Otce.“"],[30,"„U vás jsou spočítány dokonce i všechny vlasy na hlavě.“"],[31,"„Nebojte se tedy. Máte větší cenu než mnoho vrabců.“"],[32,"„Každého, kdo se ke mně přizná před lidmi, i já vyznám před svým Otcem v nebesích.“"],[33,"„Kdo mě však před lidmi zapře, toho i já zapřu před svým Otcem v nebesích.“"]]},{"title":"Ježíš přináší rozhodnutí","range":"Mt 10,34–39","thoughts":[],"verses":[[34,"„Nemyslete si, že jsem přišel přinést na zem pokoj. Nepřišel jsem přinést pokoj, ale meč.“"],[35,"„Přišel jsem postavit syna proti otci, dceru proti matce a snachu proti tchyni.“"],[36,"„Nepřáteli člověka se stanou lidé z jeho vlastního domu.“"],[37,"„Kdo miluje otce nebo matku víc než mě, není mě hoden. A kdo miluje syna nebo dceru víc než mě, není mě hoden.“"],[38,"„Kdo nebere svůj kříž a nenásleduje mě, není mě hoden.“"],[39,"„Kdo najde svůj život, ztratí ho; a kdo svůj život ztratí kvůli mně, najde ho.“"]]},{"title":"Kdo vás přijímá, přijímá mě","range":"Mt 10,40–42","thoughts":[],"verses":[[40,"„Kdo přijímá vás, přijímá mě; a kdo přijímá mě, přijímá toho, který mě poslal.“"],[41,"„Kdo přijme proroka proto, že je prorok, dostane odměnu proroka. A kdo přijme spravedlivého proto, že je spravedlivý, dostane odměnu spravedlivého.“"],[42,"„A kdo podá jednomu z těchto maličkých třeba jen pohár studené vody proto, že je mým učedníkem, amen, říkám vám: Nepřijde o svou odměnu.“"]]}];

MATTHEW_SECTIONS[11] = [{"title":"Jan Křtitel se ptá na Ježíše","range":"Mt 11,1–6","thoughts":[],"verses":[[1,"Když Ježíš dokončil pokyny svým dvanácti učedníkům, odešel odtud, aby učil a kázal v jejich městech."],[2,"Jan ve vězení slyšel o Kristových skutcích a poslal za ním dva ze svých učedníků."],[3,"Ti se ho zeptali: „Jsi ten, který má přijít, nebo máme čekat někoho jiného?“"],[4,"Ježíš jim odpověděl: „Jděte a oznamte Janovi, co slyšíte a vidíte:“"],[5,"„Slepí vidí, chromí chodí, malomocní jsou očišťováni, hluší slyší, mrtví vstávají a chudým se zvěstuje evangelium.“"],[6,"„A blaze tomu, kdo se nade mnou nepohorší.“"]]},{"title":"Ježíš mluví o Janu Křtiteli","range":"Mt 11,7–19","thoughts":[],"verses":[[7,"Když Janovi učedníci odešli, začal Ježíš mluvit k zástupům o Janovi: „Co jste vyšli na poušť vidět? Třtinu zmítanou větrem?“"],[8,"„Nebo co jste vyšli vidět? Člověka oblečeného do jemných šatů? Ti, kdo nosí jemné šaty, jsou v královských palácích.“"],[9,"„Co jste tedy vyšli vidět? Proroka? Ano, říkám vám, a ještě víc než proroka.“"],[10,"„To je ten, o němž je napsáno: Hle, posílám svého posla před tebou; on připraví tvou cestu před tebou.“"],[11,"„Amen, říkám vám: Mezi těmi, kdo se narodili z ženy, nepovstal nikdo větší než Jan Křtitel. A přece i ten nejmenší v nebeském království je větší než on.“"],[12,"„Od dnů Jana Křtitele až dodnes se nebeské království prosazuje silou a lidé se ho zmocňují.“"],[13,"„Všichni proroci i Zákon prorokovali až do Jana.“"],[14,"„A chcete-li to přijmout, on je ten Eliáš, který měl přijít.“"],[15,"„Kdo má uši k slyšení, ať slyší.“"],[16,"„Ke komu přirovnám toto pokolení? Podobá se dětem, které sedí na tržišti a volají na své druhy:“"],[17,"„Hráli jsme vám na píšťalu, a netančili jste; zpívali jsme vám žalozpěvy, a neplakali jste.“"],[18,"„Přišel Jan, nejedl ani nepil, a říkají: Má démona.“"],[19,"„Přišel Syn člověka, jí a pije, a říkají: Hle, jedlík a piják vína, přítel celníků a hříšníků. Moudrost se však prokazuje svými skutky.“"]]},{"title":"Běda městům, která nečinila pokání","range":"Mt 11,20–24","thoughts":[],"verses":[[20,"Tehdy začal Ježíš kárat města, ve kterých se stalo nejvíc jeho mocných činů, protože nečinila pokání."],[21,"„Běda ti, Chorazin! Běda ti, Betsaido! Kdyby se v Týru a Sidónu staly mocné činy, které se staly u vás, dávno by činily pokání v žíněném rouchu a popelu.“"],[22,"„Říkám vám však: Týru a Sidónu bude v den soudu snesitelněji než vám.“"],[23,"„A ty, Kafarnaum, které ses vyvýšilo až k nebi, budeš svrženo až do podsvětí. Kdyby se v Sodomě staly mocné činy, které se staly v tobě, zůstala by až dodnes.“"],[24,"„Říkám vám však: Sodomské zemi bude v den soudu snesitelněji než tobě.“"]]},{"title":"Pojďte ke mně","range":"Mt 11,25–30","thoughts":[],"verses":[[25,"V té době Ježíš řekl: „Chválím tě, Otče, Pane nebe i země, že jsi tyto věci skryl před moudrými a rozumnými a zjevil je maličkým.“"],[26,"„Ano, Otče, protože se ti tak zalíbilo.“"],[27,"„Všechno mi bylo předáno od mého Otce. Nikdo nezná Syna než Otec a nikdo nezná Otce než Syn a ten, komu ho Syn chce zjevit.“"],[28,"„Pojďte ke mně všichni, kdo se namáháte a jste obtíženi, a já vám dám odpočinutí.“"],[29,"„Vezměte na sebe mé jho a učte se ode mě, protože jsem mírný a pokorný srdcem. A naleznete odpočinutí pro své duše.“"],[30,"„Mé jho je příjemné a mé břemeno lehké.“"]]}];
MATTHEW_SECTIONS[12] = [{"title":"Ježíš je Pánem soboty","range":"Mt 12,1–8","thoughts":[],"verses":[[1,"V té době procházel Ježíš v sobotu obilím. Jeho učedníci dostali hlad, začali trhat klasy a jíst."],[2,"Když to farizeové viděli, řekli mu: „Podívej, tvoji učedníci dělají něco, co se v sobotu dělat nesmí.“"],[3,"Ježíš jim odpověděl: „Nečetli jste, co udělal David, když měl hlad on i ti, kdo byli s ním?“"],[4,"„Vešel do Božího domu a jedl posvátné chleby, které nesměl jíst on ani jeho druhové, ale pouze kněží.“"],[5,"„A nečetli jste v Zákoně, že kněží v chrámu v sobotu porušují sobotní klid, a přesto jsou bez viny?“"],[6,"„Říkám vám, že zde je někdo větší než chrám.“"],[7,"„Kdybyste věděli, co znamená: Milosrdenství chci, ne oběť, neodsuzovali byste nevinné.“"],[8,"„Syn člověka je totiž Pánem i nad sobotou.“"]]},{"title":"Uzdravení člověka s ochrnutou rukou","range":"Mt 12,9–14","thoughts":[],"verses":[[9,"Odtud Ježíš odešel a vstoupil do jejich synagogy."],[10,"Byl tam člověk s ochrnutou rukou. Zeptali se Ježíše: „Smí se v sobotu uzdravovat?“ Chtěli totiž najít důvod, proč ho obžalovat."],[11,"Ježíš jim řekl: „Kdo z vás má jedinou ovci a nevytáhne ji, když mu v sobotu spadne do jámy?“"],[12,"„Oč cennější je člověk než ovce! Proto je dovoleno v sobotu dělat dobře.“"],[13,"Potom řekl tomu člověku: „Natáhni ruku.“ On ji natáhl a byla zase zdravá jako ta druhá."],[14,"Farizeové však vyšli ven a radili se proti Ježíšovi, jak by ho mohli zahubit."]]},{"title":"Boží služebník","range":"Mt 12,15–21","thoughts":[],"verses":[[15,"Ježíš se o tom dozvěděl a odešel odtud. Šlo za ním mnoho lidí a on je všechny uzdravoval."],[16,"Přísně jim však přikázal, aby ho neprozrazovali,"],[17,"aby se naplnilo, co bylo řečeno skrze proroka Izaiáše:"],[18,"„Hle, můj služebník, kterého jsem vyvolil, můj milovaný, v němž má má duše zalíbení. Vložím na něj svého Ducha a on oznámí národům spravedlnost.“"],[19,"„Nebude se hádat ani křičet a nikdo neuslyší na ulicích jeho hlas.“"],[20,"„Nalomenou třtinu nedolomí a doutnající knot neuhasí, dokud nedovede spravedlnost k vítězství.“"],[21,"„A v jeho jménu budou národy skládat naději.“"]]},{"title":"Ježíš a Belzebub","range":"Mt 12,22–32","thoughts":[],"verses":[[22,"Tehdy k němu přivedli člověka posedlého démonem, který byl slepý a němý. Ježíš ho uzdravil, takže začal mluvit i vidět."],[23,"Všechny zástupy žasly a říkaly: „Není snad tento člověk Syn Davidův?“"],[24,"Když to farizeové uslyšeli, řekli: „Démony vyhání jen mocí Belzebuba, vládce démonů.“"],[25,"Ježíš znal jejich myšlenky a řekl jim: „Každé království rozdělené samo proti sobě zpustne a žádné město ani dům rozdělený sám proti sobě neobstojí.“"],[26,"„Jestliže satan vyhání satana, je rozdělen sám proti sobě. Jak tedy může jeho království obstát?“"],[27,"„A jestliže já vyháním démony mocí Belzebuba, čí mocí je vyhánějí vaši synové? Proto budou vašimi soudci.“"],[28,"„Jestliže však vyháním démony Božím Duchem, pak k vám přišlo Boží království.“"],[29,"„Jak může někdo vejít do domu silného člověka a uloupit jeho věci, pokud toho silného nejprve nespoutá? Teprve potom může jeho dům vyplenit.“"],[30,"„Kdo není se mnou, je proti mně, a kdo se mnou neshromažďuje, rozptyluje.“"],[31,"„Proto vám říkám: Každý hřích i rouhání může být lidem odpuštěno, ale rouhání proti Duchu odpuštěno nebude.“"],[32,"„Kdo řekne slovo proti Synu člověka, tomu bude odpuštěno. Kdo však bude mluvit proti Duchu svatému, tomu nebude odpuštěno ani v tomto věku, ani v budoucím.“"]]},{"title":"Strom se pozná po ovoci","range":"Mt 12,33–37","thoughts":[],"verses":[[33,"„Buď je strom dobrý a jeho ovoce dobré, nebo je strom špatný a jeho ovoce špatné. Strom se totiž pozná po ovoci.“"],[34,"„Plemeno zmijí! Jak můžete mluvit dobře, když jste zlí? Ústa totiž mluví z toho, čím je naplněno srdce.“"],[35,"„Dobrý člověk vynáší z dobrého pokladu dobré věci, zlý člověk ze zlého pokladu vynáší zlé.“"],[36,"„Říkám vám, že z každého zbytečného slova, které lidé řeknou, budou v den soudu skládat účet.“"],[37,"„Podle svých slov budeš ospravedlněn a podle svých slov budeš odsouzen.“"]]},{"title":"Znamení Jonášovo","range":"Mt 12,38–45","thoughts":[],"verses":[[38,"Tehdy mu někteří učitelé Zákona a farizeové řekli: „Mistře, chceme od tebe vidět znamení.“"],[39,"Ježíš jim odpověděl: „Zlé a nevěrné pokolení hledá znamení, ale žádné znamení mu nebude dáno kromě znamení proroka Jonáše.“"],[40,"„Jako byl Jonáš tři dny a tři noci v břiše veliké ryby, tak bude Syn člověka tři dny a tři noci v srdci země.“"],[41,"„Ninivští muži povstanou při soudu s tímto pokolením a odsoudí je, protože činili pokání při Jonášově kázání. A hle, zde je někdo větší než Jonáš.“"],[42,"„Královna jihu povstane při soudu s tímto pokolením a odsoudí je, protože přišla z končin země, aby slyšela Šalomounovu moudrost. A hle, zde je někdo větší než Šalomoun.“"],[43,"„Když nečistý duch vyjde z člověka, prochází vyprahlými místy a hledá odpočinutí, ale nenachází ho.“"],[44,"„Tehdy řekne: Vrátím se do svého domu, odkud jsem vyšel. Když přijde, najde ho prázdný, vyčištěný a uklizený.“"],[45,"„Potom jde a vezme s sebou sedm jiných duchů, horších než je sám. Vejdou dovnitř a usadí se tam. A konečný stav toho člověka je horší než první. Tak to bude i s tímto zlým pokolením.“"]]},{"title":"Ježíšova pravá rodina","range":"Mt 12,46–50","thoughts":[],"verses":[[46,"Když ještě mluvil k zástupům, jeho matka a bratři stáli venku a chtěli s ním mluvit."],[47,"Někdo mu řekl: „Tvoje matka a tvoji bratři stojí venku a chtějí s tebou mluvit.“"],[48,"Ježíš mu odpověděl: „Kdo je moje matka a kdo jsou moji bratři?“"],[49,"Ukázal rukou na své učedníky a řekl: „Hle, moje matka a moji bratři.“"],[50,"„Každý, kdo plní vůli mého Otce v nebesích, je můj bratr, sestra i matka.“"]]}];
MATTHEW_SECTIONS[13] = [{"title":"Podobenství o rozsévači","range":"Mt 13,1–9","thoughts":[],"verses":[[1,"Toho dne vyšel Ježíš z domu a posadil se u jezera."],[2,"Shromáždily se kolem něho tak veliké zástupy, že nastoupil na loď a posadil se v ní, zatímco celý zástup stál na břehu."],[3,"Mluvil k nim mnoho v podobenstvích: „Hle, rozsévač vyšel rozsévat.“"],[4,"„Když rozséval, některá semena padla podél cesty, přiletěli ptáci a sezobali je.“"],[5,"„Jiná padla na skalnatou půdu, kde nebylo mnoho země. Rychle vzešla, protože půda nebyla hluboká.“"],[6,"„Když však vyšlo slunce, byla spálena, a protože neměla kořen, uschla.“"],[7,"„Jiná padla mezi trní. Trní vyrostlo a udusilo je.“"],[8,"„Jiná padla do dobré půdy a přinesla úrodu: některá stonásobnou, jiná šedesátinásobnou a jiná třicetinásobnou.“"],[9,"„Kdo má uši k slyšení, ať slyší.“"]]},{"title":"Proč Ježíš mluví v podobenstvích","range":"Mt 13,10–17","thoughts":[],"verses":[[10,"Učedníci k němu přistoupili a zeptali se: „Proč k nim mluvíš v podobenstvích?“"],[11,"Odpověděl jim: „Vám je dáno poznat tajemství nebeského království, jim však dáno není.“"],[12,"„Kdo má, tomu bude dáno a bude mít hojnost. Kdo však nemá, tomu bude vzato i to, co má.“"],[13,"„Proto k nim mluvím v podobenstvích: dívají se, ale nevidí; poslouchají, ale neslyší ani nerozumějí.“"],[14,"„Naplňuje se na nich Izaiášovo proroctví: Budete stále poslouchat, ale nepochopíte; budete stále hledět, ale neuvidíte.“"],[15,"„Srdce tohoto lidu zhrublo, jejich uši těžce slyší a své oči zavřeli, aby očima neviděli, ušima neslyšeli, srdcem nepochopili, neobrátili se a já je neuzdravil.“"],[16,"„Vaše oči jsou však blahoslavené, protože vidí, a vaše uši, protože slyší.“"],[17,"„Amen, říkám vám: Mnozí proroci a spravedliví toužili vidět to, co vidíte vy, ale neviděli to, a slyšet to, co slyšíte vy, ale neslyšeli.“"]]},{"title":"Výklad podobenství o rozsévači","range":"Mt 13,18–23","thoughts":[],"verses":[[18,"„Vy tedy slyšte, co znamená podobenství o rozsévači.“"],[19,"„Když někdo slyší slovo o království a nerozumí mu, přichází Zlý a vyrve to, co bylo zaseto do jeho srdce. To je semeno zaseté podél cesty.“"],[20,"„Semeno zaseté na skalnatou půdu je ten, kdo slyší slovo a hned je s radostí přijímá,“"],[21,"„ale nemá v sobě kořen a vydrží jen chvíli. Když kvůli slovu přijde soužení nebo pronásledování, hned odpadá.“"],[22,"„Semeno zaseté mezi trní je ten, kdo slyší slovo, ale starosti tohoto světa a klam bohatství slovo udusí a ono zůstane bez užitku.“"],[23,"„Semeno zaseté do dobré půdy je ten, kdo slovo slyší, rozumí mu a přináší úrodu: jeden stonásobnou, jiný šedesátinásobnou a jiný třicetinásobnou.“"]]},{"title":"Podobenství o plevelu mezi pšenicí","range":"Mt 13,24–30","thoughts":[],"verses":[[24,"Ježíš jim předložil jiné podobenství: „Nebeské království se podobá člověku, který na svém poli zasel dobré semeno.“"],[25,"„Když lidé spali, přišel jeho nepřítel, nasel mezi pšenici plevel a odešel.“"],[26,"„Když obilí vyrostlo a přineslo klas, ukázal se i plevel.“"],[27,"„Služebníci přišli k hospodáři a řekli mu: Pane, nezasel jsi na svém poli dobré semeno? Kde se tedy vzal plevel?“"],[28,"„Odpověděl jim: To udělal nepřítel. Služebníci se ho zeptali: Chceš, abychom šli a vytrhali ho?“"],[29,"„On však řekl: Ne, abyste při vytrhávání plevele nevytrhali spolu s ním i pšenici.“"],[30,"„Nechte obojí růst spolu až do žně. V době žně řeknu žencům: Nejprve vytrhejte plevel, svažte ho do snopků ke spálení a pšenici shromážděte do mé stodoly.“"]]},{"title":"Hořčičné zrno a kvas","range":"Mt 13,31–35","thoughts":[],"verses":[[31,"Ježíš jim předložil další podobenství: „Nebeské království se podobá hořčičnému zrnu, které člověk vzal a zasel na svém poli.“"],[32,"„Je sice menší než ostatní semena, ale když vyroste, je větší než zahradní rostliny a stane se stromem, takže přilétají nebeští ptáci a hnízdí v jeho větvích.“"],[33,"Řekl jim ještě jiné podobenství: „Nebeské království se podobá kvasu, který žena vzala a vmísila do tří měřic mouky, až všechno zkvasilo.“"],[34,"To všechno Ježíš mluvil k zástupům v podobenstvích a bez podobenství k nim nemluvil,"],[35,"aby se naplnilo, co bylo řečeno skrze proroka: „Otevřu svá ústa v podobenstvích a budu vyprávět věci skryté od založení světa.“"]]},{"title":"Výklad podobenství o plevelu","range":"Mt 13,36–43","thoughts":[],"verses":[[36,"Potom Ježíš propustil zástupy a šel domů. Jeho učedníci k němu přišli a řekli: „Vysvětli nám podobenství o plevelu na poli.“"],[37,"Odpověděl jim: „Ten, kdo zasévá dobré semeno, je Syn člověka.“"],[38,"„Pole je svět, dobré semeno jsou synové království a plevel jsou synové Zlého.“"],[39,"„Nepřítel, který ho zasel, je ďábel. Žeň je konec světa a ženci jsou andělé.“"],[40,"„Jako se plevel sbírá a pálí v ohni, tak to bude na konci světa.“"],[41,"„Syn člověka pošle své anděly a oni z jeho království odstraní všechno, co svádí k hříchu, i všechny, kdo páchají nepravost,“"],[42,"„a hodí je do ohnivé pece. Tam bude pláč a skřípění zubů.“"],[43,"„Tehdy budou spravedliví zářit jako slunce v království svého Otce. Kdo má uši k slyšení, ať slyší.“"]]},{"title":"Poklad, perla a síť","range":"Mt 13,44–52","thoughts":[],"verses":[[44,"„Nebeské království se podobá pokladu ukrytému v poli. Člověk ho najde, znovu ho ukryje a z radosti jde, prodá všechno, co má, a to pole koupí.“"],[45,"„Nebeské království se také podobá obchodníkovi, který hledá krásné perly.“"],[46,"„Když našel jednu velmi drahocennou perlu, šel, prodal všechno, co měl, a koupil ji.“"],[47,"„Nebeské království se také podobá síti spuštěné do moře, která shromáždí ryby všeho druhu.“"],[48,"„Když se naplní, vytáhnou ji na břeh, posadí se, dobré ryby vyberou do nádob a špatné vyhodí.“"],[49,"„Tak to bude na konci světa. Vyjdou andělé a oddělí zlé od spravedlivých.“"],[50,"„A hodí je do ohnivé pece. Tam bude pláč a skřípění zubů.“"],[51,"Ježíš se jich zeptal: „Porozuměli jste tomu všemu?“ Odpověděli: „Ano.“"],[52,"Řekl jim: „Proto se každý učitel Zákona, který se stal učedníkem nebeského království, podobá hospodáři, který ze svého pokladu vynáší nové i staré věci.“"]]},{"title":"Ježíš v Nazaretě","range":"Mt 13,53–58","thoughts":[],"verses":[[53,"Když Ježíš dokončil tato podobenství, odešel odtud."],[54,"Přišel do svého domova a učil je v jejich synagoze. Lidé žasli a říkali: „Odkud má tento člověk takovou moudrost a moc?“"],[55,"„Není to syn tesaře? Nejmenuje se jeho matka Marie a jeho bratři Jakub, Josef, Šimon a Juda?“"],[56,"„A nejsou všechny jeho sestry mezi námi? Odkud tedy má všechny tyto věci?“"],[57,"A pohoršovali se nad ním. Ježíš jim však řekl: „Prorok není beze cti nikde kromě své vlasti a svého domu.“"],[58,"A kvůli jejich nevěře tam neudělal mnoho mocných činů."]]}];
MATTHEW_SECTIONS[14] = [{"title":"Smrt Jana Křtitele","range":"Mt 14,1–12","thoughts":[],"verses":[[1,"V té době se tetrarcha Herodes doslechl o Ježíšovi."],[2,"Řekl svým služebníkům: „To je Jan Křtitel. Vstal z mrtvých, a proto v něm působí takové mocné síly.“"],[3,"Herodes totiž dal Jana zatknout, spoutat a uvěznit kvůli Herodiadě, manželce svého bratra Filipa."],[4,"Jan mu totiž říkal: „Není dovoleno, abys ji měl.“"],[5,"Herodes ho chtěl zabít, ale bál se lidu, protože Jana pokládali za proroka."],[6,"Když však Herodes slavil narozeniny, dcera Herodiady tančila před hosty a Herodovi se zalíbila."],[7,"Proto jí pod přísahou slíbil, že jí dá cokoli, o co požádá."],[8,"Ona, navedena svou matkou, řekla: „Dej mi sem na míse hlavu Jana Křtitele.“"],[9,"Král se zarmoutil, ale kvůli své přísaze a hostům, kteří s ním stolovali, přikázal, aby jí ji dali."],[10,"Poslal tedy kata a nechal Jana ve vězení stít."],[11,"Jeho hlavu přinesli na míse a dali dívce; ona ji odnesla své matce."],[12,"Janovi učedníci přišli, vzali jeho tělo a pohřbili je. Potom odešli a oznámili to Ježíšovi."]]},{"title":"Nasycení pěti tisíc","range":"Mt 14,13–21","thoughts":[],"verses":[[13,"Když to Ježíš uslyšel, odplul lodí na opuštěné místo, aby byl sám. Zástupy se to však dozvěděly a pěšky za ním vyšly z měst."],[14,"Když Ježíš vystoupil z lodi a uviděl veliký zástup, bylo mu jich líto a uzdravoval jejich nemocné."],[15,"K večeru k němu přišli učedníci a řekli: „Je tu pusté místo a už je pozdě. Propusť zástupy, ať si v okolních vesnicích koupí něco k jídlu.“"],[16,"Ježíš jim odpověděl: „Nemusejí odcházet. Dejte jim najíst vy.“"],[17,"Řekli mu: „Máme tu jen pět chlebů a dvě ryby.“"],[18,"Odpověděl: „Přineste mi je sem.“"],[19,"Přikázal zástupům, aby se posadily na trávu. Vzal pět chlebů a dvě ryby, vzhlédl k nebi, požehnal, lámal chleby a dával je učedníkům a učedníci zástupům."],[20,"Všichni jedli a nasytili se. Potom sesbírali zbytky a naplnili jimi dvanáct košů."],[21,"Jedlo tam asi pět tisíc mužů, nepočítaje ženy a děti."]]},{"title":"Ježíš kráčí po vodě","range":"Mt 14,22–33","thoughts":[],"verses":[[22,"Hned potom Ježíš přiměl učedníky, aby nastoupili na loď a jeli před ním na druhý břeh, zatímco on propustí zástupy."],[23,"Když zástupy propustil, vystoupil sám na horu, aby se modlil. Když nastal večer, byl tam sám."],[24,"Loď už byla daleko od břehu a zmítaly jí vlny, protože vítr vál proti nim."],[25,"K ránu k nim Ježíš přišel a kráčel po jezeře."],[26,"Když ho učedníci viděli kráčet po vodě, vyděsili se a říkali: „Je to přízrak!“ A strachem křičeli."],[27,"Ježíš na ně hned promluvil: „Vzchopte se, já jsem to. Nebojte se.“"],[28,"Petr mu odpověděl: „Pane, jsi-li to ty, přikaž mi, ať k tobě přijdu po vodě.“"],[29,"Ježíš řekl: „Pojď.“ Petr vystoupil z lodi a šel po vodě k Ježíšovi."],[30,"Když však viděl silný vítr, dostal strach. Začal se topit a vykřikl: „Pane, zachraň mě!“"],[31,"Ježíš hned vztáhl ruku, chytil ho a řekl: „Člověče malé víry, proč jsi pochyboval?“"],[32,"Když vstoupili do lodi, vítr se utišil."],[33,"Ti, kdo byli na lodi, se mu poklonili a řekli: „Opravdu jsi Boží Syn.“"]]},{"title":"Uzdravování v Genezaretu","range":"Mt 14,34–36","thoughts":[],"verses":[[34,"Když se přeplavili, dorazili do Genezaretu."],[35,"Místní lidé Ježíše poznali, rozeslali zprávu po celém okolí a přivedli k němu všechny nemocné."],[36,"Prosili ho, aby se směli dotknout alespoň okraje jeho oděvu. A všichni, kdo se ho dotkli, byli uzdraveni."]]}];
MATTHEW_SECTIONS[15] = [{"title":"Boží přikázání a lidská tradice","range":"Mt 15,1–9","thoughts":[],"verses":[[1,"Tehdy k Ježíšovi přišli z Jeruzaléma učitelé Zákona a farizeové a řekli:"],[2,"„Proč tvoji učedníci přestupují tradici starších? Když jedí, neumývají si ruce.“"],[3,"Ježíš jim odpověděl: „A proč vy přestupujete Boží přikázání kvůli své tradici?“"],[4,"„Bůh přece řekl: Cti svého otce i matku; a kdo zlořečí otci nebo matce, ať zemře.“"],[5,"„Vy však říkáte: Kdo řekne otci nebo matce: To, čím bych ti mohl pomoci, je dar určený Bohu,“"],[6,"„ten už nemusí svého otce nebo matku podporovat. Tak rušíte Boží přikázání kvůli své tradici.“"],[7,"„Pokrytci! Dobře o vás prorokoval Izaiáš:“"],[8,"„Tento lid se ke mně přibližuje svými ústy a ctí mě svými rty, ale jejich srdce je ode mě daleko.“"],[9,"„Marně mě uctívají, protože učí jako nauky lidská přikázání.“"]]},{"title":"Co člověka skutečně poskvrňuje","range":"Mt 15,10–20","thoughts":[],"verses":[[10,"Ježíš svolal zástup a řekl: „Poslouchejte a rozumějte.“"],[11,"„Člověka neposkvrňuje to, co vchází do úst, ale to, co z úst vychází.“"],[12,"Tehdy k němu přišli učedníci a řekli: „Víš, že se farizeové pohoršili, když to slyšeli?“"],[13,"Ježíš odpověděl: „Každá rostlina, kterou nezasadil můj nebeský Otec, bude vykořeněna.“"],[14,"„Nechte je být. Jsou to slepí vůdci slepých. Když slepý vede slepého, oba spadnou do jámy.“"],[15,"Petr mu řekl: „Vysvětli nám to podobenství.“"],[16,"Ježíš odpověděl: „Ani vy stále nechápete?“"],[17,"„Nerozumíte, že všechno, co vchází do úst, jde do žaludku a potom odchází ven?“"],[18,"„To, co vychází z úst, však pochází ze srdce, a právě to člověka poskvrňuje.“"],[19,"„Ze srdce totiž vycházejí zlé myšlenky, vraždy, cizoložství, smilstvo, krádeže, křivá svědectví a rouhání.“"],[20,"„To jsou věci, které člověka poskvrňují. Jíst neumytýma rukama však člověka neposkvrňuje.“"]]},{"title":"Víra kananejské ženy","range":"Mt 15,21–28","thoughts":[],"verses":[[21,"Ježíš odtud odešel do kraje Týru a Sidónu."],[22,"Tu k němu přišla kananejská žena z toho kraje a volala: „Smiluj se nade mnou, Pane, Synu Davidův! Mou dceru hrozně trápí démon.“"],[23,"Ježíš jí však neodpověděl ani slovo. Jeho učedníci k němu přistoupili a prosili: „Pošli ji pryč, vždyť za námi pořád volá.“"],[24,"Ježíš odpověděl: „Jsem poslán jen ke ztraceným ovcím z domu Izraele.“"],[25,"Ona však přišla, poklonila se mu a řekla: „Pane, pomoz mi.“"],[26,"Ježíš odpověděl: „Není správné vzít chléb dětem a hodit ho psíkům.“"],[27,"Ona řekla: „Ano, Pane, ale i psíci jedí drobky, které padají ze stolu jejich pánů.“"],[28,"Tehdy jí Ježíš odpověděl: „Ženo, tvá víra je veliká. Ať se ti stane, jak si přeješ.“ A její dcera byla od té chvíle uzdravena."]]},{"title":"Ježíš uzdravuje zástupy","range":"Mt 15,29–31","thoughts":[],"verses":[[29,"Ježíš odtud odešel ke Galilejskému jezeru, vystoupil na horu a posadil se tam."],[30,"Přišly k němu veliké zástupy. Přiváděly s sebou chromé, slepé, němé, zmrzačené a mnoho dalších a kladly je k Ježíšovým nohám. On je uzdravoval."],[31,"Zástupy žasly, když viděly, že němí mluví, zmrzačení jsou zdraví, chromí chodí a slepí vidí. A oslavovaly Boha Izraele."]]},{"title":"Nasycení čtyř tisíc","range":"Mt 15,32–39","thoughts":[],"verses":[[32,"Ježíš svolal své učedníky a řekl: „Je mi líto toho zástupu. Už tři dny zůstávají se mnou a nemají co jíst. Nechci je poslat pryč hladové, aby cestou nezeslábli.“"],[33,"Učedníci mu řekli: „Kde bychom tady na pustém místě vzali tolik chleba, abychom nasytili tak veliký zástup?“"],[34,"Ježíš se jich zeptal: „Kolik máte chlebů?“ Odpověděli: „Sedm a několik malých ryb.“"],[35,"Přikázal zástupům, aby se posadily na zem."],[36,"Vzal sedm chlebů a ryby, vzdal díky, lámal je a dával učedníkům a učedníci zástupům."],[37,"Všichni jedli a nasytili se. Ze zbylých kousků naplnili sedm košů."],[38,"Jedlo tam čtyři tisíce mužů, nepočítaje ženy a děti."],[39,"Potom Ježíš propustil zástupy, nastoupil na loď a přišel do kraje Magdala."]]}];

const VERSE_QUOTES = {
  "5:4":"„Ježíš tady neslibuje pohodový život. Mluví o životě, který je pravdivý.“",
  "5:11":"„Ne každá bolest je prohra. Některé bolesti jsou důkazem, že jsi nezradil sám sebe.“",
  "5:12":"„Radost tady není pocit. Je to odmítnutí přijmout logiku světa, že když něco bolí, tak to bylo špatně.“"
};

let selectedBook="MAT", selectedChapter=5;

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  document.querySelectorAll(".topnav button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
}
document.querySelectorAll(".topnav button[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));

const themeToggle=document.getElementById("themeToggle");
function applyTheme(mode){
  const dark=mode==="dark";
  document.body.classList.toggle("dark",dark);
  themeToggle.textContent=dark ? "☀ Světlý režim" : "☾ Tmavý režim";
}
const savedTheme=localStorage.getItem("evangelium_theme");
applyTheme(savedTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeToggle.onclick=()=>{
  const next=document.body.classList.contains("dark") ? "light" : "dark";
  localStorage.setItem("evangelium_theme",next);
  applyTheme(next);
};


function renderBookTree(){
  const host=document.getElementById("bookList");
  host.innerHTML="";
  Object.entries(BOOKS).forEach(([id,b])=>{
    const row=document.createElement("div");
    row.className="book-row";

    const btn=document.createElement("button");
    btn.className="book-btn"+(id===selectedBook?" active":"");
    btn.textContent=b.name;
    btn.onclick=()=>{
      if(id!==selectedBook) selectedChapter=1;
      selectedBook=id;
      renderBookTree();
      renderBible();
    };
    row.appendChild(btn);

    const chapters=document.createElement("div");
    chapters.className="chapters"+(id===selectedBook?" open":"");
    for(let i=1;i<=b.chapters;i++){
      const c=document.createElement("button");
      c.className="chapter-btn"+(id===selectedBook && i===selectedChapter?" active":"");
      c.textContent=i;
      c.onclick=()=>{
        selectedBook=id; selectedChapter=i;
        renderBookTree(); renderBible();
      };
      chapters.appendChild(c);
    }
    row.appendChild(chapters);
    host.appendChild(row);
  });
}

function openThought(id){
  currentCycle="A";
  document.querySelectorAll(".cycle-btn").forEach(x=>x.classList.toggle("active",x.dataset.cycle==="A"));
  showView("archiveView");
  renderSundayList();
  renderSunday("A-04-ordinary-2026",id);
}

function wireChapterInteractions(main){
  const closePassageExtras=()=>{
    main.querySelectorAll(".passage-thought-expanded,.passage-video-expanded").forEach(x=>x.classList.remove("open"));
    main.querySelectorAll("[data-inline-thought],[data-inline-video]").forEach(x=>x.classList.remove("active"));
  };

  main.querySelectorAll("[data-inline-thought]").forEach(btn=>{
    btn.onclick=()=>{
      const box=main.querySelector("#inline-"+btn.dataset.inlineThought);
      const wasOpen=box.classList.contains("open");
      closePassageExtras();
      if(!wasOpen){ box.classList.add("open"); btn.classList.add("active"); }
    };
  });

  main.querySelectorAll("[data-inline-video]").forEach(btn=>{
    btn.onclick=()=>{
      const box=main.querySelector("#inline-passage-video");
      const wasOpen=box.classList.contains("open");
      closePassageExtras();
      if(!wasOpen){ box.classList.add("open"); btn.classList.add("active"); }
    };
  });

  main.querySelectorAll("[data-verse-note]").forEach(btn=>{
    btn.onclick=()=>{
      const box=main.querySelector("#"+btn.dataset.verseNote);
      box.classList.toggle("open");
      btn.setAttribute("aria-expanded", box.classList.contains("open") ? "true" : "false");
    };
  });
}

function scrollToChapterText(){
  requestAnimationFrame(()=>{
    const target=document.querySelector("#bibleMain .passage-title") || document.querySelector("#bibleMain h2");
    if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
  });
}

function renderBible(){
  const main=document.getElementById("bibleMain");
  const b=BOOKS[selectedBook];

  if(selectedBook==="MAT" && MATTHEW_SECTIONS[selectedChapter]){
    const sections=MATTHEW_SECTIONS[selectedChapter];
    main.innerHTML=`
      <div class="eyebrow">Evangelium podle Matouše</div>
      <h2>${selectedChapter}. kapitola</h2>
      <div class="source-note">Pracovní modernizované české znění podle Bible kralické. Cílem je věrné a srozumitelné znění v současné češtině, nikoli odborný nový překlad z řečtiny.</div>

      ${sections.map(section=>`
        <section class="passage">
          <div class="passage-title">${section.title} · ${section.range}</div>

          ${section.thoughts.length ? `
          <div class="passage-thoughts">
            <strong>Myšlenky k tomuto úryvku</strong>
            <div class="thought-links">
              ${section.thoughts.map((id,i)=>`<button class="thought-link" data-inline-thought="${id}">Myšlenka ${i+1}</button>`).join("")}
              <button class="thought-link" data-inline-video="true">Video</button>
            </div>
            ${section.thoughts.map(id=>{
              const t=THOUGHTS[id];
              return `<div class="passage-thought-expanded" id="inline-${id}">
                <h4>${t.title}</h4>
                ${t.paragraphs.map(p=>`<p>${p}</p>`).join("")}
              </div>`;
            }).join("")}
            <div class="passage-video-expanded" id="inline-passage-video">
              <div class="video-wrap">
                <iframe src="https://www.youtube-nocookie.com/embed/9lovWV1zMtI" title="Libor Všetula – myšlenky k evangeliu" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
              </div>
            </div>
          </div>` : ""}

          <div class="verse-flow">
            ${section.verses.map(([n,t])=>{
              const q=VERSE_QUOTES[`${selectedChapter}:${n}`];
              return `
                <span class="verse-inline"><sup class="verse-number">${n}</sup>${t}${q?`<button class="verse-note-marker" data-verse-note="verse-note-${selectedChapter}-${n}" title="Zobrazit myšlenku k verši" aria-expanded="false">✦</button>`:""} </span>
                ${q?`<span class="verse-quote" id="verse-note-${selectedChapter}-${n}">${q}</span>`:""}
              `;
            }).join("")}
          </div>
        </section>
      `).join("")}

      <nav class="chapter-nav" aria-label="Navigace mezi kapitolami">
        <button id="prevChapter" ${selectedChapter<=1?"disabled":""}>← Předchozí kapitola</button>
        <button id="nextChapter" ${selectedChapter>=b.chapters?"disabled":""}>Další kapitola →</button>
      </nav>
    `;
    wireChapterInteractions(main);
    const prev=main.querySelector("#prevChapter");
    const next=main.querySelector("#nextChapter");
    if(prev) prev.onclick=()=>{
      if(selectedChapter>1){
        selectedChapter--;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
    if(next) next.onclick=()=>{
      if(selectedChapter<b.chapters){
        selectedChapter++;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
  } else {
    main.innerHTML=`
      <div class="eyebrow">Evangelium podle ${b.name}</div>
      <h2>${selectedChapter}. kapitola</h2>
      <div class="placeholder">
        Tato kapitola je zatím připravená ve struktuře aplikace, ale její modernizované znění ještě není vložené.
      </div>
      <nav class="chapter-nav" aria-label="Navigace mezi kapitolami">
        <button id="prevChapter" ${selectedChapter<=1?"disabled":""}>← Předchozí kapitola</button>
        <button id="nextChapter" ${selectedChapter>=b.chapters?"disabled":""}>Další kapitola →</button>
      </nav>`;
    const prev=main.querySelector("#prevChapter");
    const next=main.querySelector("#nextChapter");
    if(prev) prev.onclick=()=>{
      if(selectedChapter>1){
        selectedChapter--;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
    if(next) next.onclick=()=>{
      if(selectedChapter<b.chapters){
        selectedChapter++;
        renderBookTree();
        renderBible();
        scrollToChapterText();
      }
    };
  }
}

let currentCycle="A";
function renderSundayList(){
  const list=document.getElementById("sundayList");
  const entries=SUNDAYS[currentCycle];
  if(!entries.length){
    list.innerHTML='<div class="empty-cycle">V tomto cyklu zatím nejsou přidané žádné neděle.</div>';
    document.getElementById("archiveMain").innerHTML='<div class="placeholder">Vyber jiný cyklus nebo později přidej další přepis.</div>';
    return;
  }
  list.innerHTML=entries.map((s,i)=>`
    <button class="sunday-item ${i===0?"active":""}" data-sunday="${s.id}">
      <strong>${s.title}</strong>
      <span>${s.date} · ${s.gospel}</span>
    </button>`).join("");
  list.querySelectorAll(".sunday-item").forEach(btn=>btn.onclick=()=>{
    list.querySelectorAll(".sunday-item").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    renderSunday(btn.dataset.sunday);
  });
  renderSunday(entries[0].id);
}

function renderSunday(id, scrollThought=null){
  const s=Object.values(SUNDAYS).flat().find(x=>x.id===id);
  if(!s)return;
  const main=document.getElementById("archiveMain");
  main.innerHTML=`
    <div class="sunday-head">
      <div class="eyebrow">Cyklus ${currentCycle}</div>
      <h2>${s.title}</h2>
      <div class="sunday-meta">
        <span class="pill">${s.date}</span>
        <span class="pill">${s.gospel}</span>
        <span class="pill">Libor Všetula</span>
      </div>
    </div>

    <section class="video-panel">
      <h3>Video</h3>
      <div class="video-wrap">
        <iframe
          id="videoFrame"
          src="https://www.youtube-nocookie.com/embed/9lovWV1zMtI"
          title="Libor Všetula – myšlenky k evangeliu"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
    </section>

    <section class="transcript-section">
      <h3>Úvod</h3>
      <p>${s.intro}</p>
    </section>

    ${s.thoughtIds.map(tid=>{
      const t=THOUGHTS[tid];
      return `<section class="transcript-section" id="archive-${tid}">
        <div class="timecode">${t.time}</div>
        <h3>${t.title}</h3>
        ${t.paragraphs.map(p=>`<p>${p}</p>`).join("")}
      </section>`;
    }).join("")}

    <section class="transcript-section">
      <h3>Závěr</h3>
      <p>${s.conclusion}</p>
    </section>

    <div class="editorial">
      Přepis je redakčně vyčištěný podle dodaných titulků: odstraněna je slovní vata, opakování,
      přeřeknutí a organizační závěr. Smysl jednotlivých myšlenek zůstává zachovaný.
    </div>
  `;

  if(scrollThought){
    requestAnimationFrame(()=>document.getElementById("archive-"+scrollThought)?.scrollIntoView({behavior:"smooth",block:"start"}));
  }
}

document.querySelectorAll(".cycle-btn").forEach(btn=>btn.onclick=()=>{
  currentCycle=btn.dataset.cycle;
  document.querySelectorAll(".cycle-btn").forEach(x=>x.classList.toggle("active",x===btn));
  renderSundayList();
});

renderBookTree();
renderBible();
renderSundayList();
</script>
</body>
</html>
