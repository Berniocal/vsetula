name: Mobile latest Sunday scroll

on:
  push:
    paths:
      - '.github/workflows/mobile-latest-sunday-scroll.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile initial scroll
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          anchor = '''renderBookTree();\nrenderBible();\nrenderSundayList(latestSunday(SUNDAYS[currentCycle])?.id);\n</script>'''
          replacement = '''renderBookTree();\nrenderBible();\nrenderSundayList(latestSunday(SUNDAYS[currentCycle])?.id);\n\nfunction scrollToLatestSundayOnMobile(){\n  if(!window.matchMedia("(max-width: 820px)").matches) return;\n  requestAnimationFrame(()=>requestAnimationFrame(()=>{\n    const target=document.querySelector("#archiveMain .sunday-head h2");\n    if(target) target.scrollIntoView({behavior:"auto",block:"start"});\n  }));\n}\nwindow.addEventListener("load",()=>setTimeout(scrollToLatestSundayOnMobile,80),{once:true});\n</script>'''

          if 'function scrollToLatestSundayOnMobile' not in s:
              if anchor not in s:
                  raise SystemExit('Initial render anchor not found')
              s = s.replace(anchor, replacement, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Na mobilu otevřít poslední neděli přímo u myšlenek"
          git push
