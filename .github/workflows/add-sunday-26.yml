name: Add Sunday 26

on:
  push:
    paths:
      - '.github/workflows/add-sunday-26.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Sunday data
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '    {id:"A-25-ordinary-2026",title:"25. neděle v mezidobí",date:"20. 9. 2026",gospel:"Mt 20,1–16",videoEmbed:"https://www.youtube-nocookie.com/embed/EN0qPFUdZUo"}\n'
          new = old.rstrip('\n') + ',\n    {id:"A-26-ordinary-2026",title:"26. neděle v mezidobí",date:"27. 9. 2026",gospel:"Mt 21,28–32",videoEmbed:"https://www.youtube-nocookie.com/embed/i2uFLY-jg64"}\n'
          if 'A-26-ordinary-2026' not in s:
              if old not in s:
                  raise SystemExit('Anchor Sunday 25 not found')
              s = s.replace(old, new, 1)

          helper_anchor = '''function latestSunday(entries){\n  return entries.length ? entries[entries.length-1] : null;\n}\n'''
          helper = '''function latestSunday(entries){\n  return entries.length ? entries[entries.length-1] : null;\n}\n\nfunction sundayThoughtLabel(title){\n  if(/^\\d+\\.\\s+neděle/.test(title)){\n    return "Tři myšlenky k " + title.toLowerCase().replace(/\\bneděle\\b/g,"neděli");\n  }\n  if(title==="Květná neděle") return "Tři myšlenky ke Květné neděli";\n  if(title.startsWith("Slavnost ")) return "Tři myšlenky ke " + title.replace(/^Slavnost /,"slavnosti ");\n  return "Tři myšlenky k " + title.toLowerCase();\n}\n'''
          if 'function sundayThoughtLabel' not in s:
              if helper_anchor not in s:
                  raise SystemExit('Helper anchor not found')
              s = s.replace(helper_anchor, helper, 1)

          old_button = '${vids.map(v=>`<button class="thought-link" data-inline-video="${v.id}">▶ Tři myšlenky k ${v.title.toLowerCase()}</button>`).join("")}'
          new_button = '${vids.map(v=>`<button class="thought-link" data-inline-video="${v.id}">▶ ${sundayThoughtLabel(v.title)}</button>`).join("")}'
          if old_button in s:
              s = s.replace(old_button, new_button, 1)

          old_head = "'<div class=\"sunday-head\"><div class=\"eyebrow\">Cyklus '+currentCycle+'</div><h2>Tři myšlenky k '+s.title.toLowerCase()+'</h2><div class=\"sunday-meta\"><span class=\"pill\">'+s.date+'</span><span class=\"pill\">'+s.gospel+'</span></div></div>'+"
          new_head = "'<div class=\"sunday-head\"><div class=\"eyebrow\">Cyklus '+currentCycle+'</div><h2>'+sundayThoughtLabel(s.title)+'</h2><div class=\"sunday-meta\"><span class=\"pill\">'+s.date+'</span><span class=\"pill\">'+s.gospel+'</span></div></div>'+"
          if old_head in s:
              s = s.replace(old_head, new_head, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Přidat 26. neděli 2026 a video"
          git push
